name: truereport-s3
services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:4.52
    command: 'master -ip=seaweedfs-master -ip.bind=0.0.0.0 -port=9333'
    ports:
      - "9333:9333"
  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.52
    command: 'volume -ip=seaweedfs-volume -master=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8081'
    ports:
      - "8081:8081"
    depends_on:
      - seaweedfs-master
  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.52
    command: 'filer -ip=seaweedfs-filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8888'
    ports:
      - "8888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.52
    command: 's3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333'
    ports:
      - "8333:8333"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
      - seaweedfs-filer
