name: truereport

services:
  mysql:
    image: mysql:8.4.13
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+04:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_NAME:-truereport}
      MYSQL_USER: ${DB_USER:-truereport}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local development only. MinIO OSS is archived and receives no security patches.
  # Never use this service in production. D6 production object storage is Pending.
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional translation provider (Phase C). Not started by default:
  #   docker compose --profile libretranslate up -d libretranslate
  # The image downloads en/es/fr models on first start; expect ~2 GB RAM
  # and a few minutes of warm-up before /languages is ready.
  libretranslate:
    profiles: ["libretranslate"]
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: en,es,fr
      LT_DISABLE_WEB_UI: "true"
    ports:
      - "5000:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      # Wall-clock contract (docs/api/contracts.md section 3).
      TZ: Asia/Dubai
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-truereport}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USER: ${DB_USER:-truereport}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CHROME_PATH: /opt/chromium/chrome-linux64/chrome
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DELIVERY_FROM_ADDRESS: ${DELIVERY_FROM_ADDRESS:-reports@truereport.local}
      DELIVERY_EMAIL_PROVIDER: ${DELIVERY_EMAIL_PROVIDER:-smtp}
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-change-me-local-only}
      DELIVERY_ALLOWED_PHONE_RECIPIENTS: ${DELIVERY_ALLOWED_PHONE_RECIPIENTS:-}
      DELIVERY_ALLOWED_EMAIL_RECIPIENTS: ${DELIVERY_ALLOWED_EMAIL_RECIPIENTS:-}
      I18N_TRANSLATION_PROVIDER: ${I18N_TRANSLATION_PROVIDER:-fake}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - server_storage:/app/.truereport-storage

volumes:
  mysql_data:
  minio_data:
  server_storage:
  libretranslate_models:
