name: truereport-prod

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # Required for Flyway trigger creation under binary logging; restrict DB users separately.
      - --log-bin-trust-function-creators=1
    env_file:
      - ./prod.env
    environment:
      MYSQL_DATABASE: truereport
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./prod.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/truereport?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=utf8
      STORAGE_PROVIDER: filesystem
      STORAGE_ROOT: /app/.truereport-storage
      STORAGE_PERSISTENT_VOLUME: "true"
      STORAGE_MIN_FREE_BYTES: "1073741824"
      DEV_SEED_ENABLED: "false"
      REPORT_WORKER_DELAY_MS: "2000"
      DELIVERY_WORKER_DELAY_MS: "2000"
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - server_storage:/app/.truereport-storage
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /app/.cache:size=256m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: "2.0"

  nginx:
    image: nginx:1.31.8-alpine3.24
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - ./web/admin:/usr/share/nginx/html:ro
    mem_limit: 128m

volumes:
  mysql_data:
  server_storage:
