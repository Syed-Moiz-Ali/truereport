name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve workspace
        working-directory: client
        run: flutter pub get
      - name: Analyze (fatal infos)
        working-directory: client
        run: flutter analyze --fatal-infos
      - name: Technician widget tests
        working-directory: client/apps/technician_app
        run: flutter test
      - name: Admin widget tests
        working-directory: client/apps/admin_app
        run: flutter test

  java:
    name: Java build, tests, Modulith and ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Maven tests (Testcontainers enabled by Docker on the runner)
        working-directory: server
        run: mvn -B test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
