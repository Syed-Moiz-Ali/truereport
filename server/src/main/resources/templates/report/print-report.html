<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <!-- Light-only (C0 Workstream B): no dark variant is shipped. -->
  <meta name="color-scheme" content="light">
  <title th:text="${r.en.title}"></title>
  <style th:utext="${r.fontCss}"></style>
  <!-- TOKENS:BEGIN -->
  <style>
:root {
  color-scheme: light;
  --tr-surface: #FFFFFF;
  --tr-surface-lowest: #FFFFFF;
  --tr-surface-low: #F7F6FB;
  --tr-surface-container: #F4F3F8;
  --tr-surface-high: #EEEDF3;
  --tr-surface-highest: #E9E7ED;
  --tr-on-surface: #1A1B1F;
  --tr-on-surface-variant: #5E5D69;
  --tr-outline: #6C7A71;
  --tr-outline-variant: #DAD9DF;
  --tr-secondary: #3C4A42;
  --tr-on-secondary: #FFFFFF;
  --tr-secondary-container: #E3E1EF;
  --tr-on-secondary-container: #464651;
  --tr-error: #A3231F;
  --tr-on-error: #FFFFFF;
  --tr-error-container: #FBE9E7;
  --tr-on-error-container: #7F1D1D;
  --tr-focus: #0B63CE;
  --tr-overlay: #1A1B1F66;
  --tr-scrim: #00000066;
  --tr-brand-emerald-fill: #10B981;
  --tr-brand-emerald-on-fill: #1A1B1F;
  --tr-brand-emerald-ink: #006C49;
  --tr-brand-emerald-container: #D9FBE8;
  --tr-brand-emerald-on-container: #00422B;
  --tr-brand-deep-green-fill: #006C49;
  --tr-brand-deep-green-on-fill: #FFFFFF;
  --tr-brand-deep-green-ink: #006C49;
  --tr-brand-deep-green-container: #D9FBE8;
  --tr-brand-deep-green-on-container: #00422B;
  --tr-brand-fill: var(--tr-brand-emerald-fill);
  --tr-on-brand-fill: var(--tr-brand-emerald-on-fill);
  --tr-brand-ink: var(--tr-brand-emerald-ink);
  --tr-brand-container: var(--tr-brand-emerald-container);
  --tr-on-brand-container: var(--tr-brand-emerald-on-container);
  --tr-neutral: #3F4A54;
  --tr-neutral-bg: #EDF1F3;
  --tr-info: #1D5C8A;
  --tr-info-bg: #E5F0F8;
  --tr-success: #1F6B45;
  --tr-success-bg: #E6F3EC;
  --tr-warning: #8A5A00;
  --tr-warning-bg: #FFF4D6;
  --tr-danger: #A3231F;
  --tr-danger-bg: #FBE9E7;
  --tr-critical: #7F1D1D;
  --tr-critical-bg: #F7DADA;

  --tr-space-xxs: 2px;
  --tr-space-xs: 4px;
  --tr-space-micro: 6px;
  --tr-space-sm: 8px;
  --tr-space-md: 12px;
  --tr-space-lg: 16px;
  --tr-space-gutter: 20px;
  --tr-space-xl: 24px;
  --tr-space-xxl: 32px;
  --tr-space-xxxl: 40px;
  --tr-space-huge: 48px;
  --tr-space-massive: 64px;
  --tr-space-colossal: var(--tr-space-massive);

  --tr-radius-sm: 4px;
  --tr-radius-md: 8px;
  --tr-radius-lg: 12px;
  --tr-radius-xl: 16px;
  --tr-radius-card: 24px;
  --tr-radius-card-large: 32px;
  --tr-radius-sheet: 48px;
  --tr-radius-pill: 999px;

  --tr-font-latin: "Plus Jakarta Sans", "Noto Sans", "Noto Sans SC", system-ui, sans-serif;
  --tr-font-arabic: "Noto Sans Arabic", "IBM Plex Sans Arabic", "Plus Jakarta Sans", "Noto Sans", sans-serif;
  --tr-font-arabic-alt: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Plus Jakarta Sans", "Noto Sans", sans-serif;
  --tr-font-cjk: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;

  --tr-shadow-card: 0px 2px 8px 0px #00000004, 0px 14px 40px 0px #0000000B;
  --tr-shadow-floating: 0px 4px 12px 0px #00000008, 0px 18px 50px 0px #00000014;
  --tr-shadow-button-emerald: 0px 10px 25px 0px #10B9814D;
  --tr-shadow-button-deep-green: 0px 10px 25px 0px #006C494D;
  --tr-shadow-focus: 0 0 0 2px var(--tr-focus);

  --primary: var(--tr-brand-ink);
  --secondary: var(--tr-secondary);
  --surface: var(--tr-surface);
  --surface-low: var(--tr-surface-low);
  --surface-card: var(--tr-surface-lowest);
  --surface-high: var(--tr-surface-high);
  --on-surface: var(--tr-on-surface);
  --on-variant: var(--tr-on-surface-variant);
  --outline: var(--tr-outline);
  --success: var(--tr-success);
  --success-bg: var(--tr-success-bg);
  --warning: var(--tr-warning);
  --warning-bg: var(--tr-warning-bg);
  --danger: var(--tr-danger);
  --danger-bg: var(--tr-danger-bg);
  --critical: var(--tr-critical);
  --critical-bg: var(--tr-critical-bg);
  --spacing-xxs: var(--tr-space-xxs);
  --spacing-xs: var(--tr-space-xs);
  --spacing-micro: var(--tr-space-micro);
  --spacing-sm: var(--tr-space-sm);
  --spacing-md: var(--tr-space-md);
  --spacing-lg: var(--tr-space-lg);
  --spacing-gutter: var(--tr-space-gutter);
  --spacing-xl: var(--tr-space-xl);
  --spacing-xxl: var(--tr-space-xxl);
  --spacing-xxxl: var(--tr-space-xxxl);
  --spacing-huge: var(--tr-space-huge);
  --spacing-massive: var(--tr-space-massive);
  --radius-sm: var(--tr-radius-sm);
  --radius-md: var(--tr-radius-md);
  --radius-lg: var(--tr-radius-lg);
  --radius-xl: var(--tr-radius-xl);
  --radius-card: var(--tr-radius-card);
  --radius-card-large: var(--tr-radius-card-large);
  --radius-sheet: var(--tr-radius-sheet);
  --radius-pill: var(--tr-radius-pill);
  --font-body: var(--tr-font-latin);
  --font-arabic: var(--tr-font-arabic);
  --font-cjk: var(--tr-font-cjk);
}
  </style>
  <!-- TOKENS:END -->
  <style>
    @page { size: A4; margin: 16mm 13mm 20mm; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--tr-on-surface); font-family: "TR Sans", "TR Arabic", "TR CJK", sans-serif; font-size: 9.5pt; line-height: 1.38; }
    [lang="ar"], [dir="rtl"] { font-family: "TR Arabic", "TR Sans", "TR CJK", sans-serif; }
    [lang="zh-Hans"] { font-family: "TR CJK", "TR Sans", sans-serif; }
    h1 { margin: 0 0 3mm; font-size: 22pt; line-height: 1.08; letter-spacing: -0.04em; }
    h2 { margin: 0 0 2mm; font-size: 13pt; color: var(--tr-brand-emerald-ink); }
    h3 { margin: 3mm 0 1.5mm; font-size: 10.5pt; color: var(--tr-secondary); }
    p { margin: 0 0 1.8mm; }
    .ar { direction: rtl; text-align: right; }
    .bilingual { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
    .muted { color: var(--tr-on-surface-variant); }
    .small { font-size: 8pt; }
    .cover { border-bottom: 1.2mm solid var(--tr-brand-emerald-ink); padding-bottom: 5mm; margin-bottom: 6mm; }
    .brand { color: var(--tr-secondary); font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 4mm; }
    .box { border: .3mm solid var(--tr-outline-variant); border-radius: 2mm; padding: 3mm; break-inside: avoid; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; margin: 3mm 0 5mm; }
    .stat { border: .3mm solid var(--tr-outline-variant); border-radius: 2mm; padding: 3mm; }
    .stat strong { display: block; font-size: 17pt; color: var(--tr-brand-emerald-ink); line-height: 1; }
    .badge { display: inline-block; border-radius: 99mm; padding: .5mm 2mm; font-size: 7.5pt; font-weight: 700; background: var(--tr-neutral-bg); color: var(--tr-on-surface-variant); }
    .badge.danger { background: var(--tr-danger-bg); color: var(--tr-danger); }
    .badge.warning { background: var(--tr-warning-bg); color: var(--tr-warning); }
    .badge.critical { background: var(--tr-critical-bg); color: var(--tr-critical); }
    .badge.success { background: var(--tr-success-bg); color: var(--tr-success); }
    .finding { border: .3mm solid var(--tr-outline-variant); border-left: 1.2mm solid var(--tr-secondary); border-radius: 1.5mm; padding: 3mm; margin: 0 0 3mm; break-inside: avoid; }
    .finding.safety { border-left-color: var(--tr-critical); }
    .note { background: var(--tr-surface-low); border-radius: 1.2mm; padding: 2mm; margin: 1.5mm 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; margin: 2mm 0 4mm; }
    th, td { border: .25mm solid var(--tr-outline-variant); padding: 1.7mm; vertical-align: top; text-align: left; }
    th { background: var(--tr-surface-high); color: var(--tr-on-surface-variant); font-size: 7.5pt; text-transform: uppercase; letter-spacing: .04em; }
    [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
    .item-head { display: flex; justify-content: space-between; gap: 2mm; align-items: baseline; }
    .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm; margin-top: 2mm; }
    .photos figure { margin: 0; break-inside: avoid; }
    .photos img { display: block; width: 100%; height: 30mm; object-fit: cover; border-radius: 1mm; border: .25mm solid var(--tr-outline-variant); }
    figcaption { font-size: 7pt; color: var(--tr-on-surface-variant); margin-top: .8mm; }
    .disclaimer { border-left: 1.2mm solid var(--tr-warning); background: var(--tr-warning-bg); padding: 3mm; border-radius: 1.2mm; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: .25mm solid var(--tr-outline-variant); padding-top: 1.5mm; background: var(--tr-surface-lowest); font-size: 7.5pt; color: var(--tr-on-surface-variant); }
    .page-break { break-before: page; }
    ul { margin: 0 0 2mm; padding-left: 5mm; padding-right: 0; }
    [dir="rtl"] ul { padding-left: 0; padding-right: 5mm; }
    .hash { font-family: monospace; font-size: 6.5pt; word-break: break-all; }
  </style>
</head>
<body>
<div class="footer">
  <span th:text="${r.reportNumber} + ' · ' + ${r.en.version} + ' ' + ${r.version}"></span>
  <span aria-hidden="true"> · </span>
  <span>TrueReport</span>
</div>

<div class="cover">
  <div class="brand">TrueReport</div>
  <div class="bilingual">
    <div>
      <h1 th:text="${r.en.title}"></h1>
      <p class="muted" th:text="${r.en.notCertified}"></p>
    </div>
    <div class="ar" lang="ar">
      <h1 th:text="${r.ar.title}"></h1>
      <p class="muted" th:text="${r.ar.notCertified}"></p>
    </div>
  </div>
  <div class="meta">
    <div class="box">
      <div class="muted small" th:text="${r.en.reportId}"></div>
      <strong th:text="${r.reportNumber}"></strong>
      <div class="small" th:text="${r.en.version} + ': ' + ${r.version}"></div>
      <div class="small" th:text="${r.en.finalized} + ': ' + ${r.finalizedAt}"></div>
    </div>
    <div class="box ar" lang="ar">
      <div class="muted small" th:text="${r.ar.reportId}"></div>
      <strong th:text="${r.reportNumber}"></strong>
      <div class="small" th:text="${r.ar.version} + ': ' + ${r.version}"></div>
      <div class="small" th:text="${r.ar.finalized} + ': ' + ${r.finalizedAt}"></div>
    </div>
  </div>
</div>

<h2><span th:text="${r.en.summary}"></span> / <span th:text="${r.ar.summary}"></span></h2>
<div class="stats">
  <div class="stat"><strong th:text="${r.coverage.text}"></strong><span class="small"><span th:text="${r.en.checksCompleted}"></span> / <span class="ar" th:text="${r.ar.checksCompleted}"></span></span></div>
  <div class="stat"><strong th:text="${#lists.size(r.keyFindings)}"></strong><span class="small"><span th:text="${r.en.keyFindings}"></span> / <span class="ar" th:text="${r.ar.keyFindings}"></span></span></div>
  <div class="stat"><strong th:text="${r.coverage.notApplicable}"></strong><span class="small"><span th:text="${r.en.notApplicable}"></span> / <span class="ar" th:text="${r.ar.notApplicable}"></span></span></div>
  <div class="stat"><strong th:text="${r.coverage.notChecked + r.coverage.couldNotVerify}"></strong><span class="small"><span th:text="${r.en.notCompleted}"></span> / <span class="ar" th:text="${r.ar.notCompleted}"></span></span></div>
</div>
<p class="small muted"><span th:text="${r.en.coverageNotScore}"></span> / <span class="ar" th:text="${r.ar.coverageNotScore}"></span></p>

<div class="bilingual">
  <div class="box">
    <h2 th:text="${r.en.vehicle}"></h2>
    <p th:text="${r.vehicle.make} + ' ' + ${r.vehicle.model} + ' ' + (${r.vehicle.year} ?: '')"></p>
    <p class="small"><span th:text="${r.en.vin}"></span> / <span th:text="${r.ar.vin}"></span><span th:text="': '"></span><span class="ltr" th:text="${r.vehicle.vinMasked}"></span></p>
    <p class="small" th:if="${r.vehicle.odometer != ''}" th:text="${r.en.odometer} + ': ' + ${r.vehicle.odometer}"></p>
    <p class="small" th:text="${r.en.workshop} + ': ' + ${r.workshop.name}"></p>
    <p class="small" th:text="${r.en.technician} + ': ' + ${r.technician.displayName}"></p>
    <p class="small" th:text="${r.en.scope} + ': ' + ${r.inspection.scope}"></p>
    <p class="small" th:text="${r.en.template} + ': ' + ${r.inspection.templateVersion}"></p>
  </div>
  <div class="box ar" lang="ar">
    <h2 th:text="${r.ar.vehicle}"></h2>
    <p th:text="${r.vehicle.make} + ' ' + ${r.vehicle.model} + ' ' + (${r.vehicle.year} ?: '')"></p>
    <p class="small"><span th:text="${r.ar.vin} + ': '"></span><span class="ltr" th:text="${r.vehicle.vinMasked}"></span></p>
    <p class="small" th:if="${r.vehicle.odometer != ''}" th:text="${r.ar.odometer} + ': ' + ${r.vehicle.odometer}"></p>
    <p class="small" th:text="${r.ar.workshop} + ': ' + ${r.workshop.name}"></p>
    <p class="small" th:text="${r.ar.technician} + ': ' + ${r.technician.displayName}"></p>
    <p class="small" th:text="${r.ar.scope} + ': ' + ${r.inspection.scope}"></p>
    <p class="small" th:text="${r.ar.template} + ': ' + ${r.inspection.templateVersion}"></p>
  </div>
</div>

<h2><span th:text="${r.en.keyFindings}"></span> / <span th:text="${r.ar.keyFindings}"></span></h2>
<p th:if="${#lists.isEmpty(r.keyFindings)}"><span th:text="${r.en.noKeyFindings}"></span> / <span class="ar" th:text="${r.ar.noKeyFindings}"></span></p>
<div th:each="item : ${r.keyFindings}" class="finding" th:classappend="${item.severityCode == 'SAFETY_CRITICAL' ? 'safety' : ''}">
  <div class="item-head">
    <strong th:text="${item.labelEn} + ' / ' + ${item.labelAr}"></strong>
    <span class="badge" th:classappend="${item.severityCode == 'SAFETY_CRITICAL' ? 'critical' : (item.severityCode == 'MAJOR' ? 'danger' : 'warning')}"
          th:if="${item.severityCode != ''}" th:text="${item.severityEn} + ' / ' + ${item.severityAr}"></span>
  </div>
  <p class="small" th:text="${item.resultEn} + ' / ' + ${item.resultAr}"></p>
  <div class="note" th:if="${item.note != ''}" th:lang="${item.noteLanguage}" th:dir="${item.noteDir}" th:text="${item.note}"></div>
  <p class="small" th:if="${item.reason != ''}"><span th:text="${r.en.reason}"></span> / <span class="ar" th:text="${r.ar.reason}"></span><span th:text="': ' + ${item.reason}"></span></p>
  <div class="photos" th:if="${!#lists.isEmpty(item.photos)}">
    <figure th:each="photo : ${item.photos}" th:if="${photo.dataUri != null}">
      <img th:src="${photo.dataUri}" th:alt="${photo.altEn} + ' / ' + ${photo.altAr}">
      <figcaption th:text="${r.en.evidenceCaption} + ' / ' + ${r.ar.evidenceCaption}"></figcaption>
    </figure>
  </div>
</div>

<div class="page-break"></div>
<h2 th:text="${r.en.findings} + ' / ' + ${r.ar.findings}"></h2>
<div th:each="category : ${r.categories}">
  <h3 th:text="${category.labelEn} + ' / ' + ${category.labelAr}"></h3>
  <table>
    <thead>
    <tr>
      <th><span th:text="${r.en.check}"></span> / <span th:text="${r.ar.check}"></span></th>
      <th><span th:text="${r.en.result}"></span> / <span th:text="${r.ar.result}"></span></th>
      <th><span th:text="${r.en.severity}"></span> / <span th:text="${r.ar.severity}"></span></th>
      <th><span th:text="${r.en.note}"></span> / <span th:text="${r.ar.note}"></span></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${category.items}">
      <td>
        <strong th:text="${item.labelEn}"></strong>
        <div class="ar" th:text="${item.labelAr}"></div>
        <div class="photos" th:if="${!#lists.isEmpty(item.photos)}">
          <figure th:each="photo : ${item.photos}" th:if="${photo.dataUri != null}">
            <img th:src="${photo.dataUri}" th:alt="${photo.altEn} + ' / ' + ${photo.altAr}">
            <figcaption th:text="${r.en.evidenceCaption} + ' / ' + ${r.ar.evidenceCaption}"></figcaption>
          </figure>
        </div>
      </td>
      <td><span th:text="${item.resultEn}"></span><br><span class="ar" th:text="${item.resultAr}"></span></td>
      <td><span th:if="${item.severityEn != ''}" th:text="${item.severityEn}"></span>
        <span class="ar" th:if="${item.severityAr != ''}" th:text="${item.severityAr}"></span></td>
      <td>
        <span th:if="${item.note == ''}" class="muted">—</span>
        <span th:if="${item.note != ''}" th:lang="${item.noteLanguage}" th:dir="${item.noteDir}" th:text="${item.note}"></span>
        <div class="small muted" th:if="${item.note != ''}"><span th:text="${r.en.noTranslation}"></span> / <span class="ar" th:text="${r.ar.noTranslation}"></span></div>
        <div class="small" th:if="${item.reason != ''}"><span th:text="${r.en.reason}"></span> / <span class="ar" th:text="${r.ar.reason}"></span><span th:text="': ' + ${item.reason}"></span></div>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<div th:if="${!#lists.isEmpty(r.notChecked)}">
  <h2 th:text="${r.en.notChecked} + ' / ' + ${r.ar.notChecked}"></h2>
  <table>
    <thead><tr>
      <th><span th:text="${r.en.check}"></span> / <span th:text="${r.ar.check}"></span></th>
      <th><span th:text="${r.en.result}"></span> / <span th:text="${r.ar.result}"></span></th>
      <th><span th:text="${r.en.reason}"></span> / <span th:text="${r.ar.reason}"></span></th>
    </tr></thead>
    <tbody>
    <tr th:each="item : ${r.notChecked}">
      <td><span th:text="${item.labelEn}"></span><div class="ar" th:text="${item.labelAr}"></div></td>
      <td><span th:text="${item.resultEn}"></span><div class="ar" th:text="${item.resultAr}"></div></td>
      <td><span th:text="${item.reason}"></span></td>
    </tr>
    </tbody>
  </table>
</div>

<h2 th:text="${r.en.limitations} + ' / ' + ${r.ar.limitations}"></h2>
<div class="bilingual">
  <div>
    <ul><li th:each="value : ${r.limitationsEn}" th:text="${value}"></li></ul>
    <p class="disclaimer" th:text="${r.disclaimerEn}"></p>
  </div>
  <div class="ar" lang="ar">
    <ul><li th:each="value : ${r.limitationsAr}" th:text="${value}"></li></ul>
    <p class="disclaimer" th:text="${r.disclaimerAr}"></p>
  </div>
</div>

<h2 th:text="${r.en.reportDetails} + ' / ' + ${r.ar.reportDetails}"></h2>
<p class="small">
  <span th:text="${r.en.reportId} + ': ' + ${r.reportNumber}"></span> ·
  <span th:text="${r.en.version} + ': ' + ${r.version}"></span> ·
  <span th:text="${r.en.finalized} + ': ' + ${r.finalizedAt}"></span>
</p>
<p class="small ar" lang="ar">
  <span th:text="${r.ar.reportId} + ': ' + ${r.reportNumber}"></span> ·
  <span th:text="${r.ar.version} + ': ' + ${r.version}"></span> ·
  <span th:text="${r.ar.finalized} + ': ' + ${r.finalizedAt}"></span>
</p>
<p class="hash"><span th:text="${r.en.reportHash} + ' / ' + ${r.ar.reportHash} + ': ' + ${r.verificationHash}"></span></p>
<p class="small"><span th:text="${r.en.notCertified}"></span> / <span class="ar" th:text="${r.ar.notCertified}"></span></p>
</body>
</html>
