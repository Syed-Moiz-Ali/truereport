<!doctype html>
<html th:lang="${r.lang}" th:dir="${r.dir}">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" th:content="${r.labels.neutralDescription}">
  <meta property="og:title" th:content="${r.labels.title}">
  <meta property="og:description" th:content="${r.labels.neutralDescription}">
  <meta property="og:type" content="article">
  <title th:text="${r.labels.title}"></title>
  <link rel="stylesheet" th:href="@{/r/assets/report.css}">
  <script defer th:src="@{/r/assets/report.js}"></script>
</head>
<body>
<a class="skip-link" href="#main" th:text="${r.labels.summary}"></a>

<!-- Top Global Header -->
<header class="report-header">
  <div class="container header-inner">
    <div class="header-brand-group">
      <div class="brand-logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand">TrueReport</div>
      <div class="live-pill">
        <span class="live-dot" aria-hidden="true"></span>
        <span th:text="${r.labels.liveReport}"></span>
      </div>
      <span class="header-token-badge ltr" th:text="${token != null ? token : r.reportNumber}"></span>
    </div>
    <div class="header-actions">
      <nav class="language-switch" th:attr="aria-label=${r.labels.language}">
        <a class="button button-ghost" th:if="${r.lang == 'ar'}" th:href="@{/r/{token}(token=${token},lang='en')}"
           th:text="${r.labels.english}"></a>
        <a class="button button-ghost" th:if="${r.lang != 'ar'}" th:href="@{/r/{token}(token=${token},lang='ar')}"
           th:text="${r.labels.arabic}"></a>
      </nav>
      <a class="button button-primary header-download-btn" th:if="${r.pdfDownloadEnabled}"
         th:href="@{/r/{token}/pdf(token=${token})}">
        <span class="btn-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </span>
        <span class="btn-text-responsive" th:text="${r.labels.downloadPdf}"></span>
      </a>
      <button type="button" class="button button-icon" id="reportShareBtn" th:attr="aria-label=${r.labels.shareReport}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Sticky Sub-Navigation -->
<nav class="quick-nav-bar" th:attr="aria-label=${r.labels.overview}">
  <div class="container quick-nav-inner">
    <a href="#overview" class="nav-chip" th:text="${r.labels.overview}"></a>
    <a href="#findings" class="nav-chip nav-chip-highlight" th:text="${r.labels.findings}"></a>
    <a href="#wireframe" class="nav-chip" th:text="${r.labels.exteriorDamageMap}"></a>
    <a href="#tyres" class="nav-chip" th:text="${r.labels.tyresAndBrakes}"></a>
    <a href="#photos" class="nav-chip" th:text="${r.labels.photos}"></a>
    <a href="#verification" class="nav-chip" th:text="${r.labels.verification}"></a>
  </div>
</nav>

<main id="main" class="container full-width-layout">

  <!-- Section 1: Hero Overview Dashboard (Unified Vehicle Stage + Executive Scorecard) -->
  <section id="overview" class="hero-section" aria-labelledby="hero-title">
    <div class="hero-grid">

      <!-- Left: Comprehensive Vehicle Showcase Card -->
      <div class="card hero-vehicle-card">
        <!-- Top: Vehicle Header & Status Badges -->
        <div class="vehicle-card-header">
          <div class="vehicle-tag-row">
            <span class="tag-pill tag-pill-year" th:text="${r.vehicle.year}"></span>
            <span class="tag-pill tag-pill-specs" th:text="${r.vehicle.specsOrigin}"></span>
            <span class="tag-pill tag-pill-accent">
              <span aria-hidden="true" th:text="'✓'"></span>
              <span th:text="${r.labels.officialInspection}"></span>
            </span>
            <span class="tag-pill tag-mono ltr" th:text="${r.reportNumber}"></span>
          </div>
          <h1 id="hero-title" class="vehicle-title">
            <span th:text="${r.vehicle.make}"></span>
            <span th:text="${r.vehicle.model}"></span>
          </h1>
        </div>

        <!-- Integrated Vehicle Studio Banner -->
        <div class="hero-vehicle-banner" th:if="${!#lists.isEmpty(r.vehicleShowcase)}">
          <div class="photo-banner-wrapper">
            <img class="photo-banner-img" th:src="${r.vehicleShowcase[0].imageUrl}" th:alt="${r.vehicle.make} + ' ' + ${r.vehicle.model}">
            <div class="photo-banner-overlay"></div>
            <div class="photo-banner-badges">
              <span class="photo-verified-badge">
                <span aria-hidden="true" th:text="'✓'"></span>
                <span th:text="${r.labels.officialInspection}"></span>
              </span>
              <span class="photo-count-pill" th:text="${#lists.size(r.vehicleShowcase)} + ' ' + ${r.labels.photos}"></span>
            </div>
          </div>
          <div class="photo-banner-strip">
            <div class="banner-stat-col" th:if="${r.vehicle.odometer != ''}">
              <span class="banner-stat-lbl" th:text="${r.labels.odometer}"></span>
              <strong class="banner-stat-val" th:text="${r.vehicle.odometer}"></strong>
            </div>
            <div class="banner-stat-col">
              <span class="banner-stat-lbl" th:text="${r.labels.gearbox}"></span>
              <strong class="banner-stat-val" th:text="${r.vehicle.gearbox}"></strong>
            </div>
            <div class="banner-stat-col">
              <span class="banner-stat-lbl" th:text="${r.labels.fuelType}"></span>
              <strong class="banner-stat-val" th:text="${r.vehicle.fuelType}"></strong>
            </div>
          </div>
        </div>

        <!-- Spacious Specifications Matrix (Collapsible on mobile, open on desktop) -->
        <details class="vehicle-snapshot-details" open>
          <summary class="vehicle-snapshot-summary">
            <span class="snapshot-summary-title" th:text="${r.labels.vehicle}"></span>
            <span class="snapshot-toggle-icon" aria-hidden="true" th:text="'▾'"></span>
          </summary>
          <div class="vehicle-specs-grid">
            <div class="spec-item" th:title="${r.vehicle.vinMasked}">
              <span class="spec-label" th:text="${r.labels.vin}"></span>
              <div class="spec-val-copy-row">
                <span class="spec-value ltr" id="vinValue" th:text="${r.vehicle.vinMasked}"></span>
                <button type="button" class="spec-copy-btn" data-copy-target="#vinValue" th:attr="aria-label=${r.labels.vin}">
                  <svg class="ui-icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
              </div>
            </div>
            <div class="spec-item" th:title="${r.vehicle.drivetrain}">
              <span class="spec-label" th:text="${r.labels.drivetrain}"></span>
              <span class="spec-value" th:text="${r.vehicle.drivetrain}"></span>
            </div>
            <div class="spec-item" th:title="${r.vehicle.engineSize}">
              <span class="spec-label" th:text="${r.labels.engineSize}"></span>
              <span class="spec-value" th:text="${r.vehicle.engineSize}"></span>
            </div>
            <div class="spec-item" th:title="${r.inspection.dateTime}">
              <span class="spec-label" th:text="${r.labels.inspection}"></span>
              <span class="spec-value" th:text="${r.inspection.dateTime}"></span>
            </div>
            <div class="spec-item" th:title="${r.workshop.name}">
              <span class="spec-label" th:text="${r.labels.workshop}"></span>
              <span class="spec-value" th:text="${r.workshop.name}"></span>
            </div>
            <div class="spec-item" th:title="${r.technician.displayName}">
              <span class="spec-label" th:text="${r.labels.technician}"></span>
              <span class="spec-value" th:text="${r.technician.displayName}"></span>
            </div>
          </div>
        </details>
      </div>

      <!-- Right: Overall Condition & Executive Decision Scorecard -->
      <div class="card hero-score-card" th:style="'--score-percent: ' + ${r.passRate} + '%;'">
        <div class="score-card-header">
          <div class="decision-badge-wrap">
            <span class="decision-title" th:text="${r.labels.finalDecision}"></span>
            <span class="decision-status decision-status-approved">
              <span class="decision-icon" aria-hidden="true" th:text="'✓'"></span>
              <span th:text="${r.labels.approved}"></span>
            </span>
          </div>
        </div>

        <!-- Center Stage: SVG Metric Ring (96px mobile / 128px desktop) + Verdict -->
        <div class="score-ring-row">
          <div class="score-ring-wrapper">
            <svg class="score-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="score-ring-track" cx="60" cy="60" r="50" stroke-width="10" />
              <circle class="score-ring-fill" cx="60" cy="60" r="50" stroke-width="10" stroke-linecap="round"
                      th:style="'--score-val: ' + ${r.passRate} + ';'" />
            </svg>
            <div class="score-ring-inner">
              <span class="score-ring-grade" th:text="'A'"></span>
              <span class="score-ring-num score-large-number" th:text="${r.passRate} + '%'"></span>
            </div>
          </div>
          <div class="score-ring-meta">
            <div class="score-verdict-title">
              <span class="verdict-check-icon" aria-hidden="true" th:text="'✓'"></span>
              <strong th:text="${r.labels.approved}"></strong>
            </div>
            <div class="score-verdict-text" th:text="${r.categoriesSummary.servicesText}"></div>
            <button type="button" class="how-scoring-btn" data-action="open-scoring-modal">
              <span class="how-scoring-icon" aria-hidden="true" th:text="'ⓘ'"></span>
              <span th:text="${r.labels.systemHealthSummary}"></span>
            </button>
          </div>
        </div>

        <!-- Details Below: Passed, Attention, Defects & Checklist Breakdown -->
        <div class="odometer-details-section">
          <!-- 3 Condition Cards in a Row -->
          <div class="score-condition-cards-grid">
            <div class="condition-stat-card card-passed">
              <div class="stat-card-top">
                <span class="stat-dot dot-passed"></span>
                <span class="stat-name" th:text="${r.labels.passed}"></span>
              </div>
              <strong class="stat-count" th:text="${r.passedCount}"></strong>
            </div>
            <div class="condition-stat-card card-attention">
              <div class="stat-card-top">
                <span class="stat-dot dot-attention"></span>
                <span class="stat-name" th:text="${r.labels.attention}"></span>
              </div>
              <strong class="stat-count" th:text="${r.attentionCount}"></strong>
            </div>
            <div class="condition-stat-card card-defects">
              <div class="stat-card-top">
                <span class="stat-dot dot-defects"></span>
                <span class="stat-name" th:text="${r.labels.defects}"></span>
              </div>
              <strong class="stat-count" th:text="${r.defectCount}"></strong>
            </div>
          </div>

          <!-- Category Bars: 8px rounded bar colored by status, sorted worst first via CSS order -->
          <div class="score-category-bars-list">
            <a th:each="category, catStat : ${r.categories}"
               th:href="'#cat-accordion-' + ${catStat.index}"
               class="score-cat-bar-item"
               th:attr="data-status=${category.categoryStatus}">
              <div class="score-cat-bar-header">
                <span class="score-cat-name" th:text="${category.label}"></span>
                <div class="score-cat-right">
                  <span class="score-cat-val" th:text="${category.scoreText}"></span>
                  <span class="score-cat-badge" th:classappend="${category.categoryStatus == 'DEFECT' ? 'badge-fail' : (category.categoryStatus == 'ATTENTION' ? 'badge-attention' : 'badge-pass')}" th:text="${category.categoryStatusLabel}"></span>
                </div>
              </div>
              <div class="score-cat-bar-track">
                <div class="score-cat-bar-fill" th:style="'width: ' + ${category.score} + '%;'"
                     th:classappend="${category.categoryStatus == 'DEFECT' ? 'fill-fail' : (category.categoryStatus == 'ATTENTION' ? 'fill-warn' : 'fill-pass')}"></div>
              </div>
            </a>
          </div>

          <!-- Coverage Progress Bar & Summary -->
          <div class="score-footer-note">
            <div class="coverage-bar-track">
              <div class="coverage-bar-fill"></div>
            </div>
            <div class="coverage-label-row">
              <span class="coverage-fraction">
                <span th:text="${r.coverage.text}"></span>
                <span th:text="${r.labels.checksCompleted}"></span>
              </span>
            </div>
            <p class="muted small" th:text="${r.labels.coverageNotScore}"></p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- Section 2: Inspection Findings & Component Checklist (Full Width) -->
  <section id="findings" class="findings-hub-section" aria-labelledby="findings-title">

    <!-- Sub-Section A: Critical Key Findings (Interactive Defect Cards with Integrated Photo & Video) -->
    <div class="findings-subgroup">
      <div class="subgroup-header">
        <div class="subgroup-title-wrap">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <h2 id="findings-title" class="subgroup-title" th:text="${r.labels.keyFindings}"></h2>
        </div>
        <span class="badge danger" th:if="${!#lists.isEmpty(r.keyFindings)}" th:text="${r.labels.defectActionRequired}"></span>
      </div>

      <div class="key-findings-grid" th:if="${!#lists.isEmpty(r.keyFindings)}">
        <div th:each="item : ${r.keyFindings}"
             class="card key-finding-interactive-card"
             th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'finding-defect' : 'finding-attention'}"
             data-action="open-part-dialog"
             role="button"
             tabindex="0"
             th:attr="data-title=${item.label}, data-category=${r.labels.brakingSystem}, data-status=${item.result}, data-status-code=${item.resultCode}, data-pass-fail=${item.passFailStatus}, data-score=${item.score}, data-score-text=${item.scoreText}, data-measured=${item.measuredSpec}, data-standard=${item.standardSpec}, data-note=${item.note}, data-img=${item.partPhoto}, data-video=${item.videoUrl}, data-video-caption=${item.videoCaption}"
             th:title="${r.labels.tapToToggleDetails}">

          <div class="key-finding-top">
            <div class="key-finding-badges-row">
              <span class="badge"
                    th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'danger' : 'warning'}"
                    th:text="${item.result}"></span>
              <span class="badge"
                    th:classappend="${item.severityCode == 'SAFETY_CRITICAL' ? 'critical' : (item.severityCode == 'MAJOR' ? 'danger' : 'warning')}"
                    th:if="${item.severityCode != null and item.severityCode != ''}"
                    th:text="${item.severity}"></span>
            </div>
            <span class="key-finding-cat-label" th:text="${r.labels.brakingSystem}"></span>
          </div>

          <strong class="key-finding-title" th:text="${item.label}"></strong>

          <p th:if="${item.note != null and item.note != ''}" class="key-finding-note" th:lang="${item.noteLanguage}" th:dir="${item.noteDir}">
            <span th:text="${item.note}"></span>
          </p>

          <div class="key-finding-specs-strip" th:if="${item.measuredSpec != null and item.measuredSpec != ''}">
            <span class="spec-pill spec-pill-measured" th:text="${r.labels.measuredSpec} + ': ' + ${item.measuredSpec}"></span>
            <span class="spec-pill spec-pill-std" th:if="${item.standardSpec != null and item.standardSpec != ''}" th:text="${r.labels.standardSpec} + ': ' + ${item.standardSpec}"></span>
          </div>

          <div class="key-finding-media-strip">
            <div class="key-finding-thumb-wrap" th:if="${item.partPhoto != null and item.partPhoto != ''}">
              <img loading="lazy" th:src="${item.partPhoto}" th:alt="${item.label}" class="key-finding-thumb" width="110" height="74">
              <span class="video-indicator-badge" th:if="${item.hasVideo}">
                <span aria-hidden="true" th:text="'▶'"></span>
                <span th:text="${item.videoDuration}"></span>
              </span>
            </div>
            <div class="key-finding-cta-hint">
              <span class="hint-tap-text" th:text="${r.labels.viewPartDetails}"></span>
              <span class="hint-arrow" aria-hidden="true" th:text="'›'"></span>
            </div>
          </div>

        </div>
      </div>

      <div class="key-findings-empty-card" th:if="${#lists.isEmpty(r.keyFindings)}">
        <svg class="ui-icon icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span class="empty-text" th:text="${r.labels.noKeyFindings}"></span>
      </div>
    </div>

    <!-- Sub-Section B: Findings by Category & 32-Point Component Checklist -->
    <div class="findings-subgroup">
      <div class="subgroup-header category-findings-header">
        <div>
          <h3 class="subgroup-title" th:text="${r.labels.inspectionCriteria}"></h3>
          <p class="section-subtitle" th:text="${r.labels.inspectionCriteriaSubtitle}"></p>
        </div>
        <!-- Right side: 5 Categories Passed • 1 Category Needs Attention & Score Summary -->
        <div class="category-header-right-badges">
          <span class="services-health-pill" th:text="${r.categoriesSummary.checklistSummaryText}"></span>
          <span class="section-tag" th:text="${r.totalEvaluated} + ' ' + ${r.labels.checksCompleted}"></span>
        </div>
      </div>

      <!-- One-Click Instant Filter Bar: All (32), Passed (29), Attention (2), Failed (1) -->
      <div class="checklist-quick-filter-bar" role="tablist">
        <button type="button" class="filter-chip active" data-checklist-filter="ALL">
          <span th:text="${r.labels.allChecks}"></span>
          <span class="chip-count" th:text="${r.totalEvaluated}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-passed" data-checklist-filter="NO_ISSUE_OBSERVED">
          <span th:text="${r.labels.filterPassed}"></span>
          <span class="chip-count" th:text="${r.passedCount}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-attention" data-checklist-filter="ATTENTION_RECOMMENDED">
          <span th:text="${r.labels.filterAttention}"></span>
          <span class="chip-count" th:text="${r.attentionCount}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-failed" data-checklist-filter="DEFECT_FOUND">
          <span th:text="${r.labels.filterFailed}"></span>
          <span class="chip-count" th:text="${r.defectCount}"></span>
        </button>
      </div>

      <!-- Category Accordions Stack (Collapsed by default, auto-expanded on filter or hero click) -->
      <div class="categories-accordion-stack">
        <details th:each="category, categoryStat : ${r.categories}" class="card category-accordion"
                 th:id="'cat-accordion-' + ${categoryStat.index}"
                 th:attr="data-cat-passed=${category.passedCount}, data-cat-attention=${category.attentionCount}, data-cat-defect=${category.defectCount}">
          <summary class="category-summary">
            <div class="category-summary-title">
              <span class="accordion-arrow" aria-hidden="true">▾</span>
              <strong th:text="${category.label}"></strong>
            </div>
            <!-- Right side of category: Status badge, health score, and count -->
            <div class="category-meta-chips">
              <span class="badge" th:classappend="${category.defectCount > 0 ? 'danger badge-fail' : (category.attentionCount > 0 ? 'warning badge-attention' : 'success badge-pass')}"
                    th:text="${category.statusBadge}"></span>
              <span class="score-badge" th:classappend="${category.score >= 90 ? 'score-high' : (category.score >= 70 ? 'score-mid' : 'score-low')}">
                <span th:text="${r.labels.itemScore} + ': ' + ${category.scoreText}"></span>
              </span>
              <span class="tag-pill" th:text="${#lists.size(category.items)}"></span>
            </div>
          </summary>

          <div class="category-items-container">
            <div th:each="item : ${category.items}"
                 class="check-row-item"
                 th:attr="data-result=${item.resultCode}, data-title=${item.label}, data-category=${category.label}, data-status=${item.result}, data-status-code=${item.resultCode}, data-pass-fail=${item.passFailStatus}, data-score=${item.score}, data-score-text=${item.scoreText}, data-measured=${item.measuredSpec}, data-standard=${item.standardSpec}, data-note=${item.note}, data-img=${item.partPhoto}, data-video=${item.videoUrl}, data-video-caption=${item.videoCaption}"
                 data-action="open-part-dialog"
                 role="button"
                 tabindex="0"
                 th:title="${r.labels.viewPartDetails}">

              <div class="check-row-left">
                <span class="check-bullet" th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'bullet-defect' : (item.resultCode == 'ATTENTION_RECOMMENDED' ? 'bullet-attention' : 'bullet-passed')}">
                  <span th:if="${item.resultCode == 'NO_ISSUE_OBSERVED'}" th:text="'✓'"></span>
                  <span th:if="${item.resultCode == 'ATTENTION_RECOMMENDED'}" th:text="'!'"></span>
                  <span th:if="${item.resultCode == 'DEFECT_FOUND'}" th:text="'✕'"></span>
                </span>
                <div class="check-title-block">
                  <strong class="check-item-label" th:text="${item.label}"></strong>
                  <span class="check-item-sub small muted" th:if="${item.instruction != ''}" th:text="${item.instruction}"></span>
                </div>
              </div>

              <div class="check-row-right">
                <span class="check-metric-pill" th:text="${item.diagnosticMetric}"></span>
                <span class="check-score-pill" th:classappend="${item.score >= 90 ? 'score-high' : (item.score >= 70 ? 'score-mid' : 'score-low')}"
                      th:text="${r.labels.itemScore} + ': ' + ${item.scoreText}"></span>
                <span class="badge" th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'danger badge-fail' : (item.resultCode == 'ATTENTION_RECOMMENDED' ? 'warning badge-attention' : 'success badge-pass')}"
                      th:text="${item.passFailStatus}"></span>
                <span class="check-tap-indicator" aria-hidden="true" th:text="'›'"></span>
              </div>

            </div>
          </div>
        </details>
      </div>
    </div>

  </section>

  <!-- Section 3: 2D Vehicle Wireframe & Damage Map -->
  <section id="wireframe" class="damage-map-section" aria-labelledby="wireframe-title">
    <div class="section-header">
      <div>
        <h2 id="wireframe-title" th:text="${r.labels.exteriorDamageMap}"></h2>
        <p class="section-subtitle" th:text="${r.labels.tapPanelToInspect}"></p>
      </div>
      <span class="section-tag" th:text="${r.labels.allPanelsChecked}"></span>
    </div>

    <div class="card wireframe-card">
      <div class="wireframe-visual-container">
        <!-- SVG 2D Car Wireframe Outline with Interactive Hotspot Pins -->
        <div class="wireframe-art">
          <svg viewBox="0 0 800 320" class="car-wireframe-svg" role="img" th:attr="aria-label=${r.labels.exteriorDamageMap}">
            <path d="M 120 220 L 160 220 A 45 45 0 0 1 250 220 L 550 220 A 45 45 0 0 1 640 220 L 720 220 C 740 220 760 200 760 170 C 760 145 745 135 710 130 L 660 125 L 560 65 C 540 50 510 45 450 45 L 290 45 C 240 45 200 65 170 110 L 100 135 C 70 145 50 160 50 185 C 50 210 80 220 120 220 Z" class="car-body-path"/>
            <circle cx="205" cy="220" r="42" class="car-wheel-rim"/>
            <circle cx="595" cy="220" r="42" class="car-wheel-rim"/>
            <path d="M 290 55 L 440 55 C 490 55 520 60 535 75 L 610 125 L 285 125 L 285 55 Z" class="car-window-path"/>
            <path d="M 185 125 L 270 125 L 270 65 C 225 80 200 100 185 125 Z" class="car-window-path"/>
            <line x1="280" y1="125" x2="280" y2="215" class="car-door-seam"/>
            <line x1="435" y1="125" x2="435" y2="215" class="car-door-seam"/>
            <rect x="410" y="135" width="22" height="6" rx="3" class="car-door-handle"/>
            <rect x="255" y="135" width="22" height="6" rx="3" class="car-door-handle"/>

            <!-- Interactive Hotspot Pins for Each Zone -->
            <!-- Front Bumper -->
            <g class="zone-svg-hotspot" data-zone-target="front-bumper" transform="translate(85, 175)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'FB'"></text>
            </g>
            <!-- Hood -->
            <g class="zone-svg-hotspot" data-zone-target="hood" transform="translate(195, 105)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'HD'"></text>
            </g>
            <!-- Windshield / Roof -->
            <g class="zone-svg-hotspot" data-zone-target="windshield-roof" transform="translate(370, 50)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'RF'"></text>
            </g>
            <!-- Left Side / Doors -->
            <g class="zone-svg-hotspot" data-zone-target="left-profile" transform="translate(360, 165)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'LS'"></text>
            </g>
            <!-- Right Side / Fender -->
            <g class="zone-svg-hotspot" data-zone-target="right-profile" transform="translate(500, 165)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'RS'"></text>
            </g>
            <!-- Pinpoint Badge: Scratch on Rear Right Wheel Arch (Damaged Flag) -->
            <g class="zone-svg-hotspot damage-marker-group is-active-pin" data-zone-target="rear-right-arch" transform="translate(615, 175)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="18" class="pin-radar-pulse"/>
              <circle cx="0" cy="0" r="11" class="pin-solid-dot"/>
              <text x="0" y="4" text-anchor="middle" class="pin-icon-char" th:text="'!'"></text>
            </g>
            <!-- Rear Tailgate -->
            <g class="zone-svg-hotspot" data-zone-target="rear-tailgate" transform="translate(735, 170)" tabindex="0" role="button">
              <circle cx="0" cy="0" r="14" class="hotspot-base hotspot-clean"/>
              <text x="0" y="4" text-anchor="middle" class="hotspot-text" th:text="'RB'"></text>
            </g>
          </svg>
        </div>
      </div>

      <!-- Interactive Zone Buttons Navigation Bar -->
      <div class="damage-zone-bar" role="tablist">
        <button th:each="zone : ${r.damageZones}"
                type="button"
                class="damage-zone-btn"
                th:classappend="${zone.isDamaged ? 'has-defect active' : ''}"
                th:attr="data-zone-id=${zone.id}">
          <span class="zone-code-tag" th:text="${zone.code}"></span>
          <span class="zone-name-text" th:text="${zone.title}"></span>
          <span class="zone-status-mini-dot" th:classappend="${zone.isDamaged ? 'mini-dot-defect' : 'mini-dot-clean'}" aria-hidden="true" th:text="'●'"></span>
        </button>
      </div>

      <!-- Detail Overlay / Panel for the Selected Zone -->
      <div class="damage-zones-panel-container">
        <div th:each="zone : ${r.damageZones}"
             class="damage-zone-detail-panel"
             th:classappend="${zone.isDamaged ? 'active' : ''}"
             th:attr="data-zone-panel=${zone.id}">

          <div class="zone-panel-header">
            <div class="zone-panel-title-block">
              <svg th:if="${!zone.isDamaged}" class="ui-icon icon-success" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
              <svg th:if="${zone.isDamaged}" class="ui-icon icon-alert" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <div>
                <h3 class="zone-panel-title" th:text="${zone.title}"></h3>
                <span class="zone-panel-code-sub" th:text="${r.labels.zoneInspection}"></span>
              </div>
            </div>
            <div class="zone-panel-status-group">
              <span class="badge" th:classappend="${zone.isDamaged ? 'danger' : 'success'}" th:text="${zone.statusLabel}"></span>
            </div>
          </div>

          <div class="zone-panel-metrics">
            <div class="zone-metric-card">
              <span class="zone-metric-label" th:text="${r.labels.paintThickness}"></span>
              <strong class="zone-metric-val" th:text="${zone.paintThickness}"></strong>
            </div>
            <div class="zone-metric-card">
              <span class="zone-metric-label" th:text="${r.labels.bodyCondition}"></span>
              <strong class="zone-metric-val" th:text="${zone.isDamaged ? r.labels.cosmeticAttention : r.labels.cleanCondition}"></strong>
            </div>
          </div>

          <div class="zone-panel-assessment" th:classappend="${zone.isDamaged ? 'assessment-defect' : 'assessment-clean'}">
            <div class="assessment-content">
              <p class="assessment-text" th:text="${zone.note}"></p>
            </div>
            <!-- If damaged, interactive action to inspect full video & photo proof in dialog -->
            <div class="assessment-action" th:if="${zone.isDamaged}">
              <button type="button"
                      class="btn btn-outline zone-inspect-dialog-btn"
                      data-action="open-part-dialog"
                      th:attr="data-title=${zone.title}, data-category=${r.labels.bodyCondition}, data-status=${zone.statusLabel}, data-status-code=${zone.status}, data-pass-fail=${zone.isDamaged ? 'ATTENTION' : 'PASS'}, data-score=82, data-score-text='82/100', data-measured=${zone.paintThickness} + ' • 42mm scratch', data-standard=${r.labels.cleanCondition}, data-diagnostic-sensor='Elcometer 456 Paint Gauge & Optical Lens', data-note=${zone.note}, data-img=${zone.imageUrl}, data-video=${zone.videoUrl}, data-video-caption=${zone.videoCaption}">
                <span aria-hidden="true" th:text="'▶'"></span>
                <span th:text="${r.labels.inspectZoneProof}"></span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>

  <!-- Section 4: Modern Tyres & Braking Systems Analysis (Clean 4-Wheel Cards Grid with Interactive Dialog) -->
  <section id="tyres" class="tyres-section" aria-labelledby="tyres-title">
    <div class="section-header">
      <div>
        <h2 id="tyres-title" th:text="${r.labels.tyresAndBrakes}"></h2>
        <p class="section-subtitle" th:text="${r.labels.tapToToggleDetails}"></p>
      </div>
      <span class="section-tag" th:text="${r.labels.brakingSystem}"></span>
    </div>

    <!-- 4 Wheels Clean Cards Grid (All Clickable for Full Spec & Video Dialog) -->
    <div class="tyres-cards-quad-grid">
      <div th:each="tyre : ${r.tyreAssemblies}"
           class="card tyre-modern-card"
           th:classappend="${tyre.status == 'DEFECT_FOUND' ? 'wheel-has-defect' : (tyre.status == 'ATTENTION' ? 'wheel-has-attention' : '')}"
           data-action="open-part-dialog"
           role="button"
           tabindex="0"
           th:attr="data-title=${tyre.title}, data-category=${tyre.category}, data-status=${tyre.statusLabel}, data-status-code=${tyre.status}, data-pass-fail=${tyre.status == 'PASSED' ? 'PASS' : (tyre.status == 'ATTENTION' ? 'ATTENTION' : 'FAIL')}, data-score=${tyre.score}, data-score-text=${tyre.scoreText}, data-measured=${tyre.measuredSpec}, data-standard=${tyre.standardSpec}, data-diagnostic-sensor=${tyre.diagnosticSensor}, data-note=${tyre.technicianNote}, data-img=${tyre.imageUrl}, data-video=${tyre.videoUrl}, data-video-caption=${tyre.videoCaption}"
           th:title="${r.labels.tapToToggleDetails}">

        <div class="wheel-card-header">
          <div class="wheel-corner-identity">
            <span class="wheel-icon-bubble" th:classappend="${tyre.status == 'ATTENTION' || tyre.status == 'DEFECT_FOUND' ? 'alert-bubble' : ''}" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg>
            </span>
            <div>
              <strong class="corner-title" th:text="${tyre.position}"></strong>
              <span class="corner-code-badge" th:text="${tyre.posCode}"></span>
            </div>
          </div>
          <span class="badge" th:classappend="${tyre.status == 'PASSED' ? 'success' : (tyre.status == 'ATTENTION' ? 'warning' : 'danger')}"
                th:text="${tyre.statusLabel}"></span>
        </div>

        <div class="tread-gauge-container">
          <div class="gauge-label-row">
            <span class="gauge-caption" th:text="${r.labels.treadDepth}"></span>
            <strong class="gauge-value-text" th:text="${tyre.treadDepth}"></strong>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill"
                 th:classappend="${tyre.status == 'PASSED' ? 'gauge-fill-good' : (tyre.status == 'ATTENTION' ? 'gauge-fill-attention' : 'gauge-fill-defect')}"
                 th:style="'width: ' + ${tyre.score} + '%;'"></div>
          </div>
        </div>

        <div class="wheel-metrics-matrix">
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.pressure}"></span>
            <strong class="matrix-val" th:text="${tyre.pressure}"></strong>
          </div>
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.partDetails}"></span>
            <strong class="matrix-val" th:classappend="${tyre.status == 'ATTENTION' ? 'text-warning' : ''}" th:text="${tyre.brakePad}"></strong>
          </div>
        </div>

        <div class="wheel-defect-alert-bar" th:if="${tyre.status == 'ATTENTION' || tyre.status == 'DEFECT_FOUND'}">
          <span class="defect-alert-dot" aria-hidden="true" th:text="'●'"></span>
          <span th:text="${tyre.technicianNote}"></span>
        </div>

        <div class="wheel-tap-cta">
          <span class="wheel-tap-text" th:text="${r.labels.viewPartDetails}"></span>
          <span class="wheel-tap-arrow" aria-hidden="true" th:text="'›'"></span>
        </div>

      </div>
    </div>
  </section>

  <!-- Section 5: Official Photo Showroom (True Multi-Column Masonry Grid) -->
  <section id="photos" class="gallery-section" aria-labelledby="photos-title">
    <div class="section-header">
      <div>
        <h2 id="photos-title" th:text="${r.labels.photos}"></h2>
        <p class="section-subtitle" th:text="${r.labels.gallerySubtitle}"></p>
      </div>
      <span class="section-tag" th:text="${#lists.size(r.vehicleShowcase)} + ' ' + ${r.labels.photosDocumented}"></span>
    </div>

    <!-- Category Filter Tabs: All (32), Exterior (12), Interior (12), Mechanical (8) -->
    <div class="gallery-filter-bar" role="tablist">
      <button type="button" class="filter-chip active" data-gallery-filter="all">
        <span th:text="${r.labels.showcaseAll}"></span>
        <span class="chip-count" th:text="${#lists.size(r.vehicleShowcase)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="exterior">
        <span th:text="${r.labels.showcaseExterior}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseExterior)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="interior">
        <span th:text="${r.labels.showcaseInterior}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseInterior)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="mechanical">
        <span th:text="${r.labels.showcaseMechanical}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseMechanical)}"></span>
      </button>
    </div>

    <!-- True CSS Masonry Grid for Showroom Images -->
    <div class="gallery-masonry-container">
      <div th:each="photo : ${r.vehicleShowcase}"
           class="gallery-masonry-card"
           th:attr="data-category=${photo.category}, data-img=${photo.imageUrl}, data-caption=${photo.title}, data-note=${photo.inspectNote}"
           data-action="open-lightbox"
           tabindex="0"
           role="button"
           th:title="${r.labels.tapToEnlarge}">
        <img loading="lazy" th:src="${photo.imageUrl}" th:alt="${photo.title}" class="gallery-masonry-img">
        <div class="gallery-masonry-overlay">
          <span class="gallery-zoom-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </span>
          <span class="gallery-masonry-caption" th:text="${photo.title}"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 6: Excluded / Not Checked Items -->
  <section id="not-checked" class="not-checked-section" th:if="${!#lists.isEmpty(r.notChecked)}" aria-labelledby="not-checked-title">
    <div class="section-header">
      <h2 id="not-checked-title" th:text="${r.labels.notChecked}"></h2>
    </div>
    <div class="card not-checked-card">
      <ul class="not-checked-list">
        <li th:each="item : ${r.notChecked}" class="not-checked-item">
          <div class="item-title-col">
            <strong th:text="${item.label}"></strong>
            <span class="badge neutral" th:text="${item.result}"></span>
          </div>
          <p th:if="${item.reason != ''}" class="small muted" th:text="${r.labels.reason} + ': ' + ${item.reason}"></p>
        </li>
      </ul>
    </div>
  </section>

  <!-- Section 7: Verification & Security Integrity -->
  <section id="verification" class="verification-section" aria-labelledby="verification-title">
    <div class="section-header">
      <h2 id="verification-title" th:text="${r.labels.verification}"></h2>
      <span class="section-tag" th:text="${r.labels.tamperProof}"></span>
    </div>
    <div class="card verification-card">
      <div class="verification-grid">
        <div class="ver-col">
          <div class="ver-badge">
            <span class="ver-check" aria-hidden="true">✓</span>
            <div>
              <strong th:text="${r.labels.tamperProof}"></strong>
              <p class="small muted" th:text="${r.labels.verifiedBy} + ' ' + ${r.workshop.name}"></p>
            </div>
          </div>
        </div>
        <div class="ver-col hash-col">
          <span class="spec-label" th:text="${r.labels.reportHash}"></span>
          <code class="hash-code ltr" th:text="${r.verificationHash}"></code>
        </div>
      </div>
      <div class="disclaimer-strip">
        <p class="disclaimer-text" th:text="${r.disclaimer}"></p>
      </div>
    </div>
  </section>

</main>

<!-- Interactive Part Details & Video Proof Modal Dialog -->
<dialog id="part-detail-dialog" class="part-detail-dialog" aria-modal="true" aria-labelledby="dialog-part-title">
  <div class="dialog-content-box">
    <button type="button" class="dialog-close-btn" data-action="close-part-dialog" th:aria-label="${r.labels.close}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="dialog-header">
      <div class="dialog-header-text">
        <span id="dialog-part-cat" class="dialog-category-badge"></span>
        <h3 id="dialog-part-title" class="dialog-part-title"></h3>
      </div>
    </div>

    <!-- Prominent User-Friendly PASS / FAIL Status Ribbon -->
    <div class="dialog-status-ribbon" id="dialog-status-ribbon">
      <div class="dialog-status-left">
        <span id="dialog-pass-fail-badge" class="badge-status-pill badge-pass"></span>
        <span id="dialog-part-status" class="dialog-status-desc"></span>
      </div>
      <div class="dialog-score-box">
        <span class="dialog-score-sub" th:text="${r.labels.diagnosticScore}"></span>
        <span id="dialog-part-score" class="dialog-score-pill"></span>
      </div>
    </div>

    <div class="dialog-body-grid">
      <!-- Left: Diagnostic Specifications & Observations -->
      <div class="dialog-info-pane">
        <div class="dialog-spec-card">
          <h4 class="dialog-section-heading" th:text="${r.labels.partDetails}"></h4>
          <div class="spec-table-list">
            <div class="spec-table-row">
              <span class="spec-title" th:text="${r.labels.measuredSpec}"></span>
              <strong id="dialog-measured-spec" class="spec-value-highlight"></strong>
            </div>
            <div class="spec-table-row">
              <span class="spec-title" th:text="${r.labels.standardSpec}"></span>
              <span id="dialog-standard-spec" class="spec-value-standard"></span>
            </div>
            <div class="spec-table-row spec-score-row">
              <span class="spec-title" th:text="${r.labels.diagnosticScore}"></span>
              <div class="dialog-score-track">
                <div id="dialog-score-fill" class="dialog-score-fill"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="dialog-note-card">
          <div class="note-card-title">
            <span class="quote-icon" aria-hidden="true" th:text="'“'"></span>
            <span th:text="${r.labels.technicianObservations}"></span>
          </div>
          <p id="dialog-part-note" class="dialog-note-text"></p>
        </div>
      </div>

      <!-- Right: Photographic Evidence & Video Proof -->
      <div class="dialog-media-pane">
        <!-- Part Photo Card -->
        <div class="media-proof-box">
          <div class="media-proof-header">
            <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span th:text="${r.labels.photos}"></span>
          </div>
          <div class="media-img-wrapper" onclick="openPhotoFromDialog()" tabindex="0" role="button" th:title="${r.labels.tapToEnlarge}">
            <img id="dialog-part-img" src="" th:alt="${r.labels.photos}" class="dialog-preview-img">
            <div class="media-zoom-overlay">
              <span th:text="${r.labels.tapToEnlarge}"></span>
            </div>
          </div>
        </div>

        <!-- Video Proof Player Card -->
        <div class="media-proof-box">
          <div class="media-proof-header">
            <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            <span th:text="${r.labels.videoProof}"></span>
          </div>
          <div class="media-video-wrapper">
            <video id="dialog-part-video" controls playsinline class="dialog-proof-video" preload="metadata">
              <source src="" type="video/mp4">
            </video>
            <div class="video-caption-strip">
              <span class="video-badge-pill" th:text="${r.labels.videoProof}"></span>
              <span id="dialog-video-caption" class="video-caption-label"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dialog-footer">
      <button type="button" class="button button-ghost" data-action="close-part-dialog" th:text="${r.labels.closeDetails}"></button>
    </div>
  </div>
</dialog>

<!-- Lightbox Modal for Photo Inspection -->
<dialog id="photo-lightbox" class="lightbox-dialog" aria-modal="true" aria-labelledby="lightbox-caption">
  <div class="lightbox-content">
    <div class="lightbox-header-bar">
      <div class="lightbox-counter-pill">
        <span id="lightbox-counter-current" th:text="'1'"></span>
        <span aria-hidden="true" th:text="' / '"></span>
        <span id="lightbox-counter-total" th:text="'38'"></span>
      </div>
      <button type="button" class="lightbox-close-btn" data-action="close-lightbox" th:aria-label="${r.labels.close}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="lightbox-image-wrap">
      <button type="button" class="lightbox-nav-btn lightbox-prev-btn" data-action="lightbox-prev" th:aria-label="${r.labels.photos}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <img id="lightbox-img" src="" th:alt="${r.labels.photos}" class="lightbox-img">
      <button type="button" class="lightbox-nav-btn lightbox-next-btn" data-action="lightbox-next" th:aria-label="${r.labels.photos}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
    <div class="lightbox-details">
      <h4 id="lightbox-caption" class="lightbox-title"></h4>
      <p id="lightbox-note" class="lightbox-desc"></p>
    </div>
  </div>
</dialog>

<!-- How Scoring Works Modal Dialog -->
<dialog id="scoring-modal" class="part-detail-dialog scoring-modal" aria-modal="true" aria-labelledby="scoring-modal-title">
  <div class="dialog-content-box scoring-modal-box">
    <button type="button" class="dialog-close-btn" data-action="close-scoring-modal" th:aria-label="${r.labels.close}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="dialog-header">
      <h3 id="scoring-modal-title" class="dialog-part-title" th:text="${r.labels.systemHealthSummary}"></h3>
    </div>
    <div class="scoring-guide-content">
      <div class="grade-table-grid">
        <div class="grade-row grade-row-a">
          <span class="grade-badge badge-pass" th:text="'A'"></span>
          <div class="grade-range">
            <strong th:text="'90% – 100%'"></strong>
            <span th:text="${r.labels.goodCondition}"></span>
          </div>
        </div>
        <div class="grade-row grade-row-b">
          <span class="grade-badge badge-attention" th:text="'B'"></span>
          <div class="grade-range">
            <strong th:text="'80% – 89%'"></strong>
            <span th:text="${r.labels.attention}"></span>
          </div>
        </div>
        <div class="grade-row grade-row-c">
          <span class="grade-badge badge-attention" th:text="'C'"></span>
          <div class="grade-range">
            <strong th:text="'65% – 79%'"></strong>
            <span th:text="${r.labels.attention}"></span>
          </div>
        </div>
        <div class="grade-row grade-row-d">
          <span class="grade-badge badge-fail" th:text="'D'"></span>
          <div class="grade-range">
            <strong th:text="'< 65%'"></strong>
            <span th:text="${r.labels.defects}"></span>
          </div>
        </div>
      </div>
      <p class="muted small" th:text="${r.labels.coverageNotScore}"></p>
    </div>
    <div class="dialog-footer">
      <button type="button" class="button button-ghost" data-action="close-scoring-modal" th:text="${r.labels.close}"></button>
    </div>
  </div>
</dialog>

</body>
</html>
