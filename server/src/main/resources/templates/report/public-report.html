<!doctype html>
<html th:lang="${r.lang}" th:dir="${r.dir}">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" th:content="${r.labels.neutralDescription}">
  <meta property="og:title" th:content="${r.labels.title}">
  <meta property="og:description" th:content="${r.labels.neutralDescription}">
  <meta property="og:type" content="article">
  <title th:text="${r.labels.title}"></title>
  <link rel="stylesheet" th:href="@{/r/assets/report.css}">
  <script defer th:src="@{/r/assets/report.js}"></script>
</head>
<body>
<a class="skip-link" href="#main" th:text="${r.labels.summary}"></a>

<!-- Top Global Header -->
<header class="report-header">
  <div class="container header-inner">
    <div class="header-brand-group">
      <div class="brand">TrueReport</div>
      <div class="live-pill">
        <span class="live-dot" aria-hidden="true"></span>
        <span th:text="${r.labels.liveReport}"></span>
      </div>
    </div>
    <div class="header-actions">
      <nav class="language-switch" th:attr="aria-label=${r.labels.language}">
        <a class="button button-ghost" th:if="${r.lang == 'ar'}" th:href="@{/r/{token}(token=${token},lang='en')}"
           th:text="${r.labels.english}"></a>
        <a class="button button-ghost" th:if="${r.lang != 'ar'}" th:href="@{/r/{token}(token=${token},lang='ar')}"
           th:text="${r.labels.arabic}"></a>
      </nav>
      <a class="button button-primary" th:if="${r.pdfDownloadEnabled}"
         th:href="@{/r/{token}/pdf(token=${token})}">
        <span class="btn-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </span>
        <span th:text="${r.labels.downloadPdf}"></span>
      </a>
    </div>
  </div>
</header>

<!-- Sticky Sub-Navigation -->
<nav class="quick-nav-bar" th:attr="aria-label=${r.labels.overview}">
  <div class="container quick-nav-inner">
    <a href="#overview" class="nav-chip" th:text="${r.labels.overview}"></a>
    <a href="#findings" class="nav-chip nav-chip-highlight" th:text="${r.labels.findings}"></a>
    <a href="#wireframe" class="nav-chip" th:text="${r.labels.exteriorDamageMap}"></a>
    <a href="#tyres" class="nav-chip" th:text="${r.labels.tyresAndBrakes}"></a>
    <a href="#photos" class="nav-chip" th:text="${r.labels.photos}"></a>
    <a href="#verification" class="nav-chip" th:text="${r.labels.verification}"></a>
  </div>
</nav>

<main id="main" class="container full-width-layout">

  <!-- Section 1: Hero Overview Dashboard (Full Width 2-Column Grid) -->
  <section id="overview" class="hero-section" aria-labelledby="hero-title">
    <div class="hero-grid">
      <!-- Left: Vehicle Identity Card -->
      <div class="card hero-vehicle-card">
        <div class="vehicle-tag-row">
          <span class="tag-pill" th:text="${r.vehicle.year}"></span>
          <span class="tag-pill tag-pill-accent" th:text="${r.labels.officialInspection}"></span>
          <span class="tag-pill tag-mono ltr" th:text="${r.reportNumber}"></span>
        </div>
        <h1 id="hero-title" class="vehicle-title">
          <span th:text="${r.vehicle.make}"></span>
          <span th:text="${r.vehicle.model}"></span>
        </h1>
        <div class="vehicle-specs-grid">
          <div class="spec-item">
            <span class="spec-label" th:text="${r.labels.vin}"></span>
            <span class="spec-value ltr" th:text="${r.vehicle.vinMasked}"></span>
          </div>
          <div class="spec-item" th:if="${r.vehicle.odometer != ''}">
            <span class="spec-label" th:text="${r.labels.odometer}"></span>
            <span class="spec-value" th:text="${r.vehicle.odometer}"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" th:text="${r.labels.inspection}"></span>
            <span class="spec-value" th:text="${r.inspection.dateTime}"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" th:text="${r.labels.workshop}"></span>
            <span class="spec-value" th:text="${r.workshop.name}"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" th:text="${r.labels.technician}"></span>
            <span class="spec-value" th:text="${r.technician.displayName}"></span>
          </div>
          <div class="spec-item">
            <span class="spec-label" th:text="${r.labels.template}"></span>
            <span class="spec-value" th:text="${r.inspection.templateVersion}"></span>
          </div>
        </div>
      </div>

      <!-- Right: Overall Condition & Executive Decision Scorecard -->
      <div class="card hero-score-card">
        <div class="score-card-header">
          <div class="decision-badge-wrap">
            <span class="decision-title" th:text="${r.labels.finalDecision}"></span>
            <span class="decision-status" th:text="${r.labels.approved}"></span>
          </div>
          <span class="score-percentage-pill">
            <span th:text="${r.labels.gradeLabel} + ': A ('"></span>
            <span th:text="${r.passRate}"></span>
            <span aria-hidden="true">%)</span>
          </span>
        </div>
        <div class="score-metric-hero">
          <div class="score-circle">
            <div class="score-circle-inner">
              <span class="score-large-number" th:text="${r.passRate}"></span>
              <span class="score-small-label" th:text="${r.labels.passRateLabel}"></span>
            </div>
          </div>
          <div class="score-counts-col">
            <div class="condition-row row-passed">
              <span class="condition-dot"></span>
              <span class="condition-name" th:text="${r.labels.passed}"></span>
              <span class="condition-count" th:text="${r.passedCount}"></span>
            </div>
            <div class="condition-row row-attention">
              <span class="condition-dot"></span>
              <span class="condition-name" th:text="${r.labels.attention}"></span>
              <span class="condition-count" th:text="${r.attentionCount}"></span>
            </div>
            <div class="condition-row row-defects">
              <span class="condition-dot"></span>
              <span class="condition-name" th:text="${r.labels.defects}"></span>
              <span class="condition-count" th:text="${r.defectCount}"></span>
            </div>
          </div>
        </div>
        <!-- 4 Services Good · 1 Service Needs Service High-Impact Summary -->
        <div class="category-summary-banner">
          <span class="summary-check-icon" aria-hidden="true">🛡️</span>
          <span class="summary-banner-text" th:text="${r.categoriesSummary.servicesText}"></span>
        </div>
        <div class="score-footer-note">
          <span class="coverage-fraction">
            <span th:text="${r.coverage.text}"></span>
            <span th:text="${r.labels.checksCompleted}"></span>
          </span>
          <p class="muted small" th:text="${r.labels.coverageNotScore}"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 2: Inspection Findings & Component Checklist (Full Width) -->
  <section id="findings" class="findings-hub-section" aria-labelledby="findings-title">

    <!-- Sub-Section A: Critical Key Findings (Interactive Defect Cards with Integrated Photo & Video) -->
    <div class="findings-subgroup" th:if="${!#lists.isEmpty(r.keyFindings)}">
      <div class="subgroup-header">
        <div class="subgroup-title-wrap">
          <span class="subgroup-icon alert-icon" aria-hidden="true">⚠️</span>
          <h2 id="findings-title" class="subgroup-title" th:text="${r.labels.keyFindings}"></h2>
        </div>
        <span class="badge danger" th:text="${r.labels.defectActionRequired}"></span>
      </div>

      <div class="key-findings-grid">
        <div th:each="item : ${r.keyFindings}"
             class="card key-finding-interactive-card"
             data-action="open-part-dialog"
             role="button"
             tabindex="0"
             th:attr="data-title=${item.label}, data-category=${r.labels.brakingSystem}, data-status=${item.result}, data-status-code=${item.resultCode}, data-score=${item.score}, data-score-text=${item.scoreText}, data-measured=${item.measuredSpec}, data-standard=${item.standardSpec}, data-note=${item.note}, data-img=${item.partPhoto}, data-video=${item.videoUrl}, data-video-caption=${item.videoCaption}"
             th:title="${r.labels.tapToToggleDetails}">

          <div class="key-finding-top">
            <div class="key-finding-title-group">
              <strong class="key-finding-title" th:text="${item.label}"></strong>
              <span class="badge" th:classappend="${item.severityCode == 'SAFETY_CRITICAL' ? 'critical' : (item.severityCode == 'MAJOR' ? 'danger' : 'warning')}"
                    th:if="${item.severityCode != ''}" th:text="${item.severity}"></span>
            </div>
            <span class="badge" th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'danger' : (item.resultCode == 'ATTENTION_RECOMMENDED' ? 'warning' : 'success')}"
                  th:text="${item.result}"></span>
          </div>

          <p th:if="${item.note != ''}" class="key-finding-note" th:lang="${item.noteLanguage}" th:dir="${item.noteDir}">
            <span class="note-quote-mark" aria-hidden="true">“</span>
            <span th:text="${item.note}"></span>
          </p>

          <div class="key-finding-specs-strip" th:if="${item.measuredSpec != ''}">
            <span class="spec-pill spec-pill-measured" th:text="${r.labels.measuredSpec} + ': ' + ${item.measuredSpec}"></span>
            <span class="spec-pill spec-pill-std" th:text="${r.labels.standardSpec} + ': ' + ${item.standardSpec}"></span>
          </div>

          <div class="key-finding-media-strip">
            <div class="key-finding-thumb-wrap">
              <img loading="lazy" th:src="${item.partPhoto}" th:alt="${item.label}" class="key-finding-thumb" width="140" height="90">
              <span class="video-indicator-badge">
                <span aria-hidden="true">▶</span>
                <span th:text="${r.labels.videoProof}"></span>
              </span>
            </div>
            <div class="key-finding-cta-hint">
              <span class="hint-tap-text" th:text="${r.labels.tapToToggleDetails}"></span>
              <span class="hint-arrow" aria-hidden="true">→</span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Sub-Section B: Findings by Category & 32-Point Component Checklist -->
    <div class="findings-subgroup">
      <div class="subgroup-header category-findings-header">
        <div>
          <h3 class="subgroup-title" th:text="${r.labels.findings}"></h3>
          <p class="section-subtitle" th:text="${r.labels.tapToToggleDetails}"></p>
        </div>
        <!-- Right side: 4 Services Good · 1 Service Needs Service & Score Summary -->
        <div class="category-header-right-badges">
          <span class="services-health-pill" th:text="${r.categoriesSummary.servicesText}"></span>
          <span class="section-tag" th:text="${r.totalEvaluated} + ' ' + ${r.labels.checksCompleted}"></span>
        </div>
      </div>

      <!-- One-Click Instant Filter Bar: All (32), Passed (29), Attention (2), Failed (1) -->
      <div class="checklist-quick-filter-bar" role="tablist">
        <button type="button" class="filter-chip active" data-checklist-filter="ALL">
          <span th:text="${r.labels.allChecks}"></span>
          <span class="chip-count" th:text="${r.totalEvaluated}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-passed" data-checklist-filter="NO_ISSUE_OBSERVED">
          <span th:text="${r.labels.filterPassed}"></span>
          <span class="chip-count" th:text="${r.passedCount}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-attention" data-checklist-filter="ATTENTION_RECOMMENDED">
          <span th:text="${r.labels.filterAttention}"></span>
          <span class="chip-count" th:text="${r.attentionCount}"></span>
        </button>
        <button type="button" class="filter-chip filter-chip-failed" data-checklist-filter="DEFECT_FOUND">
          <span th:text="${r.labels.filterFailed}"></span>
          <span class="chip-count" th:text="${r.defectCount}"></span>
        </button>
      </div>

      <!-- Category Accordions Stack -->
      <div class="categories-accordion-stack">
        <details th:each="category : ${r.categories}" class="card category-accordion" open
                 th:attr="data-cat-passed=${category.passedCount}, data-cat-attention=${category.attentionCount}, data-cat-defect=${category.defectCount}">
          <summary class="category-summary">
            <div class="category-summary-title">
              <span class="accordion-arrow" aria-hidden="true">▾</span>
              <strong th:text="${category.label}"></strong>
            </div>
            <!-- Right side of category: Health score and service status -->
            <div class="category-meta-chips">
              <span class="score-badge" th:classappend="${category.score >= 90 ? 'score-high' : (category.score >= 70 ? 'score-mid' : 'score-low')}">
                <span th:text="${r.labels.itemScore} + ': ' + ${category.scoreText}"></span>
              </span>
              <span class="tag-pill" th:text="${#lists.size(category.items)}"></span>
            </div>
          </summary>

          <div class="category-items-container">
            <div th:each="item : ${category.items}"
                 class="check-row-item"
                 th:attr="data-result=${item.resultCode}, data-title=${item.label}, data-category=${category.label}, data-status=${item.result}, data-status-code=${item.resultCode}, data-score=${item.score}, data-score-text=${item.scoreText}, data-measured=${item.measuredSpec}, data-standard=${item.standardSpec}, data-note=${item.note}, data-img=${item.partPhoto}, data-video=${item.videoUrl}, data-video-caption=${item.videoCaption}"
                 data-action="open-part-dialog"
                 role="button"
                 tabindex="0"
                 th:title="${r.labels.viewPartDetails}">

              <div class="check-row-left">
                <span class="check-bullet" th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'bullet-defect' : (item.resultCode == 'ATTENTION_RECOMMENDED' ? 'bullet-attention' : 'bullet-passed')}">
                  <span th:if="${item.resultCode == 'NO_ISSUE_OBSERVED'}">✓</span>
                  <span th:if="${item.resultCode == 'ATTENTION_RECOMMENDED'}">!</span>
                  <span th:if="${item.resultCode == 'DEFECT_FOUND'}">✕</span>
                </span>
                <div class="check-title-block">
                  <strong class="check-item-label" th:text="${item.label}"></strong>
                  <span class="check-item-sub small muted" th:if="${item.instruction != ''}" th:text="${item.instruction}"></span>
                </div>
              </div>

              <div class="check-row-right">
                <span class="check-metric-pill" th:text="${item.diagnosticMetric}"></span>
                <span class="check-score-pill" th:classappend="${item.score >= 90 ? 'score-high' : (item.score >= 70 ? 'score-mid' : 'score-low')}"
                      th:text="${r.labels.itemScore} + ': ' + ${item.scoreText}"></span>
                <span class="badge" th:classappend="${item.resultCode == 'DEFECT_FOUND' ? 'danger' : (item.resultCode == 'ATTENTION_RECOMMENDED' ? 'warning' : 'success')}"
                      th:text="${item.result}"></span>
                <span class="check-tap-indicator" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </span>
              </div>

            </div>
          </div>
        </details>
      </div>
    </div>

  </section>

  <!-- Section 3: 2D Vehicle Wireframe & Damage Map -->
  <section id="wireframe" class="damage-map-section" aria-labelledby="wireframe-title">
    <div class="section-header">
      <h2 id="wireframe-title" th:text="${r.labels.exteriorDamageMap}"></h2>
      <span class="section-tag" th:text="${r.labels.bodyCondition}"></span>
    </div>
    <div class="card wireframe-card">
      <div class="wireframe-visual-container">
        <!-- SVG 2D Car Wireframe Outline -->
        <div class="wireframe-art">
          <svg viewBox="0 0 800 320" class="car-wireframe-svg" role="img" th:attr="aria-label=${r.labels.exteriorDamageMap}">
            <path d="M 120 220 L 160 220 A 45 45 0 0 1 250 220 L 550 220 A 45 45 0 0 1 640 220 L 720 220 C 740 220 760 200 760 170 C 760 145 745 135 710 130 L 660 125 L 560 65 C 540 50 510 45 450 45 L 290 45 C 240 45 200 65 170 110 L 100 135 C 70 145 50 160 50 185 C 50 210 80 220 120 220 Z" class="car-body-path"/>
            <circle cx="205" cy="220" r="42" class="car-wheel-rim"/>
            <circle cx="595" cy="220" r="42" class="car-wheel-rim"/>
            <path d="M 290 55 L 440 55 C 490 55 520 60 535 75 L 610 125 L 285 125 L 285 55 Z" class="car-window-path"/>
            <path d="M 185 125 L 270 125 L 270 65 C 225 80 200 100 185 125 Z" class="car-window-path"/>
            <line x1="280" y1="125" x2="280" y2="215" class="car-door-seam"/>
            <line x1="435" y1="125" x2="435" y2="215" class="car-door-seam"/>
            <rect x="410" y="135" width="22" height="6" rx="3" class="car-door-handle"/>
            <rect x="255" y="135" width="22" height="6" rx="3" class="car-door-handle"/>
            <!-- Pinpoint Badge: Scratch on Rear Right Wheel Arch -->
            <g class="damage-marker-group" transform="translate(615, 175)">
              <circle cx="0" cy="0" r="16" class="pin-radar-pulse"/>
              <circle cx="0" cy="0" r="9" class="pin-solid-dot"/>
              <text x="0" y="4" text-anchor="middle" class="pin-icon-char">!</text>
            </g>
          </svg>
        </div>
      </div>
      <!-- Damage Observation Banner -->
      <div class="damage-detail-strip">
        <div class="damage-flag-badge">
          <span class="dot-warning" aria-hidden="true"></span>
          <span th:text="${r.labels.cosmeticAttention}"></span>
        </div>
        <p class="damage-flag-text" th:text="${r.visualInspections[2].note}"></p>
      </div>
    </div>
  </section>

  <!-- Section 4: Modern Tyres & Braking Systems Analysis (Clean 4-Wheel Cards Grid, No Black Boxes!) -->
  <section id="tyres" class="tyres-section" aria-labelledby="tyres-title">
    <div class="section-header">
      <h2 id="tyres-title" th:text="${r.labels.tyresAndBrakes}"></h2>
      <span class="section-tag" th:text="${r.labels.brakingSystem}"></span>
    </div>

    <!-- 4 Wheels Clean Cards Grid -->
    <div class="tyres-cards-quad-grid">
      <!-- Front Left Wheel Card -->
      <div class="card tyre-modern-card">
        <div class="wheel-card-header">
          <div class="wheel-corner-identity">
            <span class="wheel-icon-bubble" aria-hidden="true">🛞</span>
            <strong class="corner-title" th:text="${r.labels.frontLeft}"></strong>
          </div>
          <span class="badge success" th:text="${r.labels.passed}"></span>
        </div>

        <div class="tread-gauge-container">
          <div class="gauge-label-row">
            <span class="gauge-caption" th:text="${r.labels.treadDepth}"></span>
            <strong class="gauge-value-text" th:text="'6.2 mm'"></strong>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill gauge-fill-good" style="width: 78%;"></div>
          </div>
        </div>

        <div class="wheel-metrics-matrix">
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.pressure}"></span>
            <strong class="matrix-val" th:text="'34 PSI'"></strong>
          </div>
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.partDetails}"></span>
            <strong class="matrix-val" th:text="'7.5 mm'"></strong>
          </div>
        </div>
      </div>

      <!-- Front Right Wheel Card -->
      <div class="card tyre-modern-card">
        <div class="wheel-card-header">
          <div class="wheel-corner-identity">
            <span class="wheel-icon-bubble" aria-hidden="true">🛞</span>
            <strong class="corner-title" th:text="${r.labels.frontRight}"></strong>
          </div>
          <span class="badge success" th:text="${r.labels.passed}"></span>
        </div>

        <div class="tread-gauge-container">
          <div class="gauge-label-row">
            <span class="gauge-caption" th:text="${r.labels.treadDepth}"></span>
            <strong class="gauge-value-text" th:text="'6.0 mm'"></strong>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill gauge-fill-good" style="width: 75%;"></div>
          </div>
        </div>

        <div class="wheel-metrics-matrix">
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.pressure}"></span>
            <strong class="matrix-val" th:text="'34 PSI'"></strong>
          </div>
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.partDetails}"></span>
            <strong class="matrix-val" th:text="'7.5 mm'"></strong>
          </div>
        </div>
      </div>

      <!-- Rear Left Wheel Card -->
      <div class="card tyre-modern-card">
        <div class="wheel-card-header">
          <div class="wheel-corner-identity">
            <span class="wheel-icon-bubble" aria-hidden="true">🛞</span>
            <strong class="corner-title" th:text="${r.labels.rearLeft}"></strong>
          </div>
          <span class="badge success" th:text="${r.labels.passed}"></span>
        </div>

        <div class="tread-gauge-container">
          <div class="gauge-label-row">
            <span class="gauge-caption" th:text="${r.labels.treadDepth}"></span>
            <strong class="gauge-value-text" th:text="'5.8 mm'"></strong>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill gauge-fill-good" style="width: 72%;"></div>
          </div>
        </div>

        <div class="wheel-metrics-matrix">
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.pressure}"></span>
            <strong class="matrix-val" th:text="'36 PSI'"></strong>
          </div>
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.partDetails}"></span>
            <strong class="matrix-val" th:text="'6.8 mm'"></strong>
          </div>
        </div>
      </div>

      <!-- Rear Right Wheel Card (Defect Flagged) -->
      <div class="card tyre-modern-card wheel-has-defect">
        <div class="wheel-card-header">
          <div class="wheel-corner-identity">
            <span class="wheel-icon-bubble alert-bubble" aria-hidden="true">⚠️</span>
            <strong class="corner-title" th:text="${r.labels.rearRight}"></strong>
          </div>
          <span class="badge danger" th:text="${r.labels.defects}"></span>
        </div>

        <div class="tread-gauge-container">
          <div class="gauge-label-row">
            <span class="gauge-caption" th:text="${r.labels.treadDepth}"></span>
            <strong class="gauge-value-text text-danger" th:text="'5.5 mm'"></strong>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill gauge-fill-defect" style="width: 68%;"></div>
          </div>
        </div>

        <div class="wheel-metrics-matrix">
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.pressure}"></span>
            <strong class="matrix-val" th:text="'35 PSI'"></strong>
          </div>
          <div class="wheel-matrix-box">
            <span class="matrix-lbl" th:text="${r.labels.partDetails}"></span>
            <strong class="matrix-val text-danger" th:text="'6.8 mm'"></strong>
          </div>
        </div>

        <div class="wheel-defect-alert-bar">
          <span class="defect-alert-dot" aria-hidden="true">●</span>
          <span th:text="${r.visualInspections[6].note}"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 5: Official Photo Showroom (True Multi-Column Masonry Grid) -->
  <section id="photos" class="gallery-section" aria-labelledby="photos-title">
    <div class="section-header">
      <div>
        <h2 id="photos-title" th:text="${r.labels.photos}"></h2>
        <p class="section-subtitle" th:text="${r.labels.gallerySubtitle}"></p>
      </div>
      <span class="section-tag" th:text="${#lists.size(r.vehicleShowcase)} + ' ' + ${r.labels.photosDocumented}"></span>
    </div>

    <!-- Category Filter Tabs: All (32), Exterior (12), Interior (12), Mechanical (8) -->
    <div class="gallery-filter-bar" role="tablist">
      <button type="button" class="filter-chip active" data-gallery-filter="all">
        <span th:text="${r.labels.showcaseAll}"></span>
        <span class="chip-count" th:text="${#lists.size(r.vehicleShowcase)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="exterior">
        <span th:text="${r.labels.showcaseExterior}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseExterior)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="interior">
        <span th:text="${r.labels.showcaseInterior}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseInterior)}"></span>
      </button>
      <button type="button" class="filter-chip" data-gallery-filter="mechanical">
        <span th:text="${r.labels.showcaseMechanical}"></span>
        <span class="chip-count" th:text="${#lists.size(r.showcaseMechanical)}"></span>
      </button>
    </div>

    <!-- True CSS Masonry Grid for Showroom Images -->
    <div class="gallery-masonry-container">
      <div th:each="photo : ${r.vehicleShowcase}"
           class="gallery-masonry-card"
           th:attr="data-category=${photo.category}, data-img=${photo.imageUrl}, data-caption=${photo.title}, data-note=${photo.inspectNote}"
           data-action="open-lightbox"
           tabindex="0"
           role="button"
           th:title="${r.labels.tapToEnlarge}">
        <img loading="lazy" th:src="${photo.imageUrl}" th:alt="${photo.title}" class="gallery-masonry-img">
        <div class="gallery-masonry-overlay">
          <span class="gallery-zoom-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </span>
          <span class="gallery-masonry-caption" th:text="${photo.title}"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 6: Excluded / Not Checked Items -->
  <section id="not-checked" class="not-checked-section" th:if="${!#lists.isEmpty(r.notChecked)}" aria-labelledby="not-checked-title">
    <div class="section-header">
      <h2 id="not-checked-title" th:text="${r.labels.notChecked}"></h2>
    </div>
    <div class="card not-checked-card">
      <ul class="not-checked-list">
        <li th:each="item : ${r.notChecked}" class="not-checked-item">
          <div class="item-title-col">
            <strong th:text="${item.label}"></strong>
            <span class="badge neutral" th:text="${item.result}"></span>
          </div>
          <p th:if="${item.reason != ''}" class="small muted" th:text="${r.labels.reason} + ': ' + ${item.reason}"></p>
        </li>
      </ul>
    </div>
  </section>

  <!-- Section 7: Verification & Security Integrity -->
  <section id="verification" class="verification-section" aria-labelledby="verification-title">
    <div class="section-header">
      <h2 id="verification-title" th:text="${r.labels.verification}"></h2>
      <span class="section-tag" th:text="${r.labels.tamperProof}"></span>
    </div>
    <div class="card verification-card">
      <div class="verification-grid">
        <div class="ver-col">
          <div class="ver-badge">
            <span class="ver-check" aria-hidden="true">✓</span>
            <div>
              <strong th:text="${r.labels.tamperProof}"></strong>
              <p class="small muted" th:text="${r.labels.verifiedBy} + ' ' + ${r.workshop.name}"></p>
            </div>
          </div>
        </div>
        <div class="ver-col hash-col">
          <span class="spec-label" th:text="${r.labels.reportHash}"></span>
          <code class="hash-code ltr" th:text="${r.verificationHash}"></code>
        </div>
      </div>
      <div class="disclaimer-strip">
        <p class="disclaimer-text" th:text="${r.disclaimer}"></p>
      </div>
    </div>
  </section>

</main>

<!-- Interactive Part Details & Video Proof Modal Dialog -->
<dialog id="part-detail-dialog" class="part-detail-dialog" aria-modal="true" aria-labelledby="dialog-part-title">
  <div class="dialog-content-box">
    <button type="button" class="dialog-close-btn" data-action="close-part-dialog" th:aria-label="${r.labels.close}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="dialog-header">
      <div class="dialog-header-text">
        <span id="dialog-part-cat" class="dialog-category-badge"></span>
        <h3 id="dialog-part-title" class="dialog-part-title"></h3>
      </div>
      <div class="dialog-badge-group">
        <span id="dialog-part-score" class="dialog-score-pill"></span>
        <span id="dialog-part-status" class="badge"></span>
      </div>
    </div>

    <div class="dialog-body-grid">
      <!-- Left: Diagnostic Specifications & Observations -->
      <div class="dialog-info-pane">
        <div class="dialog-spec-card">
          <h4 class="dialog-section-heading" th:text="${r.labels.partDetails}"></h4>
          <div class="spec-table-list">
            <div class="spec-table-row">
              <span class="spec-title" th:text="${r.labels.measuredSpec}"></span>
              <strong id="dialog-measured-spec" class="spec-value-highlight"></strong>
            </div>
            <div class="spec-table-row">
              <span class="spec-title" th:text="${r.labels.standardSpec}"></span>
              <span id="dialog-standard-spec" class="spec-value-standard"></span>
            </div>
            <div class="spec-table-row spec-score-row">
              <span class="spec-title" th:text="${r.labels.diagnosticScore}"></span>
              <div class="dialog-score-track">
                <div id="dialog-score-fill" class="dialog-score-fill"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="dialog-note-card">
          <div class="note-card-title">
            <span class="quote-icon" aria-hidden="true">“</span>
            <span th:text="${r.labels.technicianObservations}"></span>
          </div>
          <p id="dialog-part-note" class="dialog-note-text"></p>
        </div>
      </div>

      <!-- Right: Photographic Evidence & Video Proof -->
      <div class="dialog-media-pane">
        <!-- Part Photo Card -->
        <div class="media-proof-box">
          <div class="media-proof-header">
            <span aria-hidden="true">📷</span>
            <span th:text="${r.labels.photos}"></span>
          </div>
          <div class="media-img-wrapper" onclick="openPhotoFromDialog()" tabindex="0" role="button" th:title="${r.labels.tapToEnlarge}">
            <img id="dialog-part-img" src="" th:alt="${r.labels.photos}" class="dialog-preview-img">
            <div class="media-zoom-overlay">
              <span th:text="${r.labels.tapToEnlarge}"></span>
            </div>
          </div>
        </div>

        <!-- Video Proof Player Card -->
        <div class="media-proof-box">
          <div class="media-proof-header">
            <span aria-hidden="true">🎥</span>
            <span th:text="${r.labels.videoProof}"></span>
          </div>
          <div class="media-video-wrapper">
            <video id="dialog-part-video" controls playsinline class="dialog-proof-video" preload="metadata">
              <source src="" type="video/mp4">
            </video>
            <div class="video-caption-strip">
              <span class="video-badge-pill" th:text="${r.labels.videoProof}"></span>
              <span id="dialog-video-caption" class="video-caption-label"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dialog-footer">
      <button type="button" class="button button-ghost" data-action="close-part-dialog" th:text="${r.labels.closeDetails}"></button>
    </div>
  </div>
</dialog>

<!-- Lightbox Modal for Photo Inspection -->
<dialog id="photo-lightbox" class="lightbox-dialog" aria-modal="true" aria-labelledby="lightbox-caption">
  <div class="lightbox-content">
    <button type="button" class="lightbox-close-btn" data-action="close-lightbox" th:aria-label="${r.labels.close}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lightbox-image-wrap">
      <img id="lightbox-img" src="" th:alt="${r.labels.photos}" class="lightbox-img">
    </div>
    <div class="lightbox-details">
      <h4 id="lightbox-caption" class="lightbox-title"></h4>
      <p id="lightbox-note" class="lightbox-desc"></p>
    </div>
  </div>
</dialog>

</body>
</html>
