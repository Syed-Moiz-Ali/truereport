server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  application:
    name: truereport-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/truereport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-mysql
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

truereport:
  jwt:
    issuer: truereport
    audience: truereport-api
    secret: ${JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P30D
    challenge-ttl: PT5M
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  auth:
    admin-totp:
      required: ${ADMIN_TOTP_REQUIRED:false}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./.truereport-storage}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
      create-bucket: ${S3_CREATE_BUCKET:false}
      sse: ${S3_SSE:}
      kms-key-id: ${S3_KMS_KEY_ID:}
  invitations:
    ttl: PT72H
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  pii:
    keys: ${APP_PII_KEYS:}
    active-key-id: ${APP_PII_ACTIVE_KEY_ID:v1}
  retention:
    enabled: ${RETENTION_ENABLED:false}
    revoked-link-days: ${RETENTION_REVOKED_LINK_DAYS:0}
    delivery-days: ${RETENTION_DELIVERY_DAYS:0}
    soft-deleted-evidence-days: ${RETENTION_SOFT_DELETED_EVIDENCE_DAYS:0}
    delete-soft-deleted-evidence: ${RETENTION_DELETE_SOFT_DELETED_EVIDENCE:false}
    cron: ${RETENTION_CRON:0 30 2 * * *}
  delivery:
    real-recipients-enabled: ${DELIVERY_REAL_RECIPIENTS_ENABLED:false}
    allowed-phone-recipients: ${DELIVERY_ALLOWED_PHONE_RECIPIENTS:}
    allowed-email-recipients: ${DELIVERY_ALLOWED_EMAIL_RECIPIENTS:}
    fake-enabled: ${DELIVERY_FAKE_ENABLED:true}
    email-provider: ${DELIVERY_EMAIL_PROVIDER:smtp}
    from-address: ${DELIVERY_FROM_ADDRESS:reports@truereport.local}
    webhook-secret: ${DELIVERY_WEBHOOK_SECRET:change-me-local-only}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:3}
    retry-base-seconds: ${DELIVERY_RETRY_BASE_SECONDS:30}
    rate-limit-per-hour: ${DELIVERY_RATE_LIMIT_PER_HOUR:10}
    email-max-attachment-bytes: ${DELIVERY_EMAIL_MAX_ATTACHMENT_BYTES:10485760}
    worker-delay-ms: ${DELIVERY_WORKER_DELAY_MS:2000}
  report:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    chrome-path: ${CHROME_PATH:}
    worker-delay-ms: ${REPORT_WORKER_DELAY_MS:2000}
  dev:
    seed-enabled: ${DEV_SEED_ENABLED:false}
    seed-password: ${DEV_SEED_PASSWORD:}
