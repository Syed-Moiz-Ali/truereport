server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: truereport-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/truereport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

truereport:
  jwt:
    issuer: truereport
    audience: truereport-api
    secret: ${JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P30D
    challenge-ttl: PT5M
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./.truereport-storage}
  invitations:
    ttl: PT72H
  dev:
    seed-enabled: ${DEV_SEED_ENABLED:false}
    seed-password: ${DEV_SEED_PASSWORD:}
