spring:
  datasource:
    url: jdbc:h2:mem:truereport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-h2

truereport:
  jwt:
    issuer: truereport
    audience: truereport-api
    secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    access-ttl: PT15M
    refresh-ttl: P30D
    challenge-ttl: PT5M
  encryption:
    key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
  storage:
    local-root: ./target/test-storage
  invitations:
    ttl: PT72H
  dev:
    seed-enabled: false
    seed-password:
  report:
    worker-enabled: false
    public-base-url: http://localhost:8080
  delivery:
    worker-enabled: false
    fake-enabled: true
    email-provider: fake
    from-address: reports@test.local
    webhook-secret: test-webhook-secret
    allowed-phone-recipients: +971500009900
    allowed-email-recipients: private.9900@example.test
    max-attempts: 3
    retry-base-seconds: 1
    rate-limit-per-hour: 5
    email-max-attachment-bytes: 10485760

logging:
  level:
    org.hibernate.SQL: WARN
