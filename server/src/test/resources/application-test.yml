spring:
  datasource:
    url: jdbc:h2:mem:truereport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

truereport:
  jwt:
    issuer: truereport
    audience: truereport-api
    secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    access-ttl: PT15M
    refresh-ttl: P30D
    challenge-ttl: PT5M
  encryption:
    key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
  storage:
    local-root: ./target/test-storage
  invitations:
    ttl: PT72H
  dev:
    seed-enabled: false
    seed-password:

logging:
  level:
    org.hibernate.SQL: WARN
