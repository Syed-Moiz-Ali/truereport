name: truereport_workspace
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

workspace:
  - apps/technician_app
  - apps/admin_app
  - packages/core
  - packages/design_system
  - packages/l10n
  - packages/api_client
  - packages/domain
  - packages/auth
  - packages/offline_sync

dev_dependencies:
  melos: 8.10.0

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
    test:
      run: melos exec --dir-exists=test -- flutter test
    format:
      run: melos exec -- dart format .
