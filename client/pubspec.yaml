name: truereport_workspace
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

workspace:
  - apps/technician_app
  - apps/workshop_admin_app
  - apps/platform_admin_app
  - apps/ui_gallery
  - packages/core
  - packages/design_system
  - packages/l10n
  - packages/api_client
  - packages/reference_data
  - packages/domain
  - packages/auth

dev_dependencies:
  melos: 8.10.0

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
    format:
      run: melos exec -- dart format .
